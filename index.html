async function saveField(el){
  const key=el.dataset.k; let v=el.value; if(v==='')v=null;
  const old=CUR[key];
  const upd={updated_by:ME.user_id}; upd[key]=v;
  if(key==='first_name'||key==='last_name'){
    const ln=(key==='last_name'?(v||''):(CUR.last_name||'')), fn=(key==='first_name'?(v||''):(CUR.first_name||''));
    upd.full_name=(((ln||'')+((ln&&fn)?', ':'')+(fn||'')).trim())||'(sin nombre)';
  }
  const {data,error}=await DB().from('patients').update(upd).eq('id',CUR.id).select().single();
  if(error){toast('No se pudo guardar: '+error.message);return;}
  CUR=data; renderSideA();
  // deja una entrada firmada en el registro cuando se corrige un dato de base
  const oldS=(old==null?'':(''+old)), newS=(v==null?'':(''+v));
  if(HC_EDIT && oldS!==newS){
    const L=FIELD_LABEL[key]||key;
    const content=CORR_PREFIX+' · '+L+': «'+(oldS||'(vacío)')+'» → «'+(newS||'(vacío)')+'»';
    try{ DB().from('notes').insert({patient_id:CUR.id, discipline:(ROLE_TO_DISC[ME.role]||'oncologia'), content:content, author_id:ME.user_id, created_by:ME.user_id}).then(()=>{},()=>{}); }catch(e){}
  }
  const n=$('saveNote'); if(n){n.innerHTML='<span class="ok">✓ Guardado</span>';setTimeout(()=>{const s=$('saveNote');if(s)s.textContent='Los cambios se guardan solos y quedan en la auditoría con tu nombre y la hora.';},1600);}
}

function habitsParse(s){
  const o={}, rest=[]; const KEY={'Tabaco':'tabaco','Alcohol':'alcohol','Actividad física':'act_fisica','Alimentación':'alimentacion','Otros':'hab_otros'};
  (s||'').split(' · ').forEach(p=>{ const m=p.match(/^(Tabaco|Alcohol|Actividad física|Alimentación|Otros): (.*)$/); if(m) o[KEY[m[1]]]=m[2].trim(); else if(p.trim()) rest.push(p.trim()); });
  if(rest.length) o.hab_otros=[o.hab_otros,rest.join(' · ')].filter(Boolean).join(' · ');
  return o;
}
function habitsCompile(sec,data){
  return sec.f.map(f=>{ const v=gnStr(data[f.k]); return v?(f.label+': '+v):''; }).filter(Boolean).join(' · ');
}
function gnOpen(tplId, note, force){
  const tpl=NOTE_TPL[tplId]; if(!tpl) return;
  if(!note && !force){   // ¿ya empezó hoy una nota con esta plantilla? → ofrecer continuarla
    const mine=((FCALC&&FCALC.notes)||[]).find(n=>n.author_id===ME.user_id && n.structured && n.structured.tpl===tplId && sameDay(n.created_at) && noteEditable(n));
    if(mine){
      askChoice({where:'Al abrir una nota guiada', title:'Ya empezaste una nota de '+tpl.label.toLowerCase()+' hoy', existing:tpl.label+' · hoy '+fmtHM(mine.created_at),
        detail:'Guardada · la podés editar hasta 24 h después de creada', why:'Así la consulta queda en una sola nota y no en dos partes.', primary:'Continuar esa nota', secondary:'Empezar otra nota'})
        .then(ch=>{ if(ch==='primary') gnOpen(tplId,mine); else if(ch==='secondary') gnOpen(tplId,null,true); });
      return;
    }
  }
  if(note && !noteEditable(note)){ toast('Ya no se puede editar (pasaron 24 horas)'); return; }
  const data={}, fromFicha={};
  if(note && note.structured && note.structured.data) Object.assign(data, note.structured.data);
  else if(tpl.kind==='inicial'){
    tpl.secs.forEach(s=>{
      s.f.forEach(f=>{ if(f.map && CUR[f.map]!=null && (''+CUR[f.map]).trim()!==''){ data[f.k]=''+CUR[f.map]; fromFicha[s.k]=true; } });
      if(s.habits && CUR[s.habits]){ Object.assign(data, habitsParse(CUR[s.habits])); fromFicha[s.k]=true; }
    });
  }
  GN={tplId, tpl, pid:CUR.id, noteId:note?note.id:null, data, fromFicha, touched:!!note, dirty:false, timer:null, chain:Promise.resolve(),
      orig:{}, filled:{}, corr:{}, canWrite: !!tpl.writeback && FICHA_WRITERS.includes(ME.role), locked:false};
  gnRender(); gnStatus(note?'saved':'idle');
  document.body.classList.add('gn-open'); $('gn').hidden=false; $('gn').scrollTop=0;
}

function gnSpy(){
  if(!('IntersectionObserver' in window)) return;
  if(GN._io) GN._io.disconnect();
  const io=new IntersectionObserver(es=>{ es.forEach(e=>{ if(e.isIntersecting){ document.querySelectorAll('#gn .gn-idx li').forEach(li=>li.classList.toggle('cur',li.dataset.go===e.target.dataset.sec)); } }); },{root:$('gn'),rootMargin:'-20% 0px -70% 0px'});
  document.querySelectorAll('#gn .gsec').forEach(s=>io.observe(s)); GN._io=io;
}

  const T={idle:'Se guarda solo', typing:'Se guarda solo', saving:'Guardando…', saved:'Se guarda solo · guardado recién', retry:'Reintentando…', locked:'Pasaron 24 h: la nota ya no se edita'};
  o.className='gn-save'+((st==='retry'||st==='locked')?' warn':'');
  o.innerHTML=(st==='retry'||st==='locked'?'':GN_IC.check)+esc(T[st]||T.idle);
}
function gnSchedule(){ if(!GN||GN.locked) return; GN.touched=true; GN.dirty=true; gnStatus('typing'); clearTimeout(GN.timer); GN.timer=setTimeout(gnFlush,1300); }
function gnFlush(){
  const g=GN; if(!g) return Promise.resolve();
  clearTimeout(g.timer);
  if(!g.dirty) return g.chain;
  g.dirty=false;
  g.chain=g.chain.then(()=>gnSaveNow(g));
  return g.chain;
}
function gnCompile(tpl,data){
  const out=[];

      if(f.t==='date') v=fmt(v);
      parts.push(f.unit ? (f.label+' '+v+' '+f.unit) : (f.label ? f.label+': '+v : v));
    });
    if(s.anthro && gnStr(data.peso)){ const a=anthro(data.peso, gnStr(data.talla)||CUR.height_cm); if(a) parts.push('IMC '+a.imc.toFixed(1)+' · SC '+a.bsa.toFixed(2)+' m²'); }
    if(parts.length) out.push(s.label+': '+parts.join(' · '));
  });
  return out.join('\n');
}
async function gnSaveNow(g){
  if(g.locked) return;
  const content=gnCompile(g.tpl,g.data);
  if(!g.noteId && (!g.touched || !content.trim())) { if(GN===g) gnStatus('idle'); return; }  // no se crean notas vacías
  if(GN===g) gnStatus('saving');
  const w=num(gnStr(g.data.peso));
  const rec={content, weight_kg:(w>0?w:null)};
  if(!GN_NO_STRUCT) rec.structured={tpl:g.tplId, label:g.tpl.label, v:1, data:g.data};
  try{
    let res;
    if(!g.noteId){
      res=await DB().from('notes').insert(Object.assign({patient_id:g.pid, discipline:g.tpl.disc, author_id:ME.user_id, created_by:ME.user_id, is_confidential:!!g.tpl.confidential}, rec)).select('id,created_at').single();
      if(!res.error){ g.noteId=res.data.id; }
    } else {
      res=await DB().from('notes').update(Object.assign({updated_by:ME.user_id}, rec)).eq('id',g.noteId).select('id');
      if(!res.error && (!res.data || !res.data.length)){ g.locked=true; if(GN===g) gnStatus('locked'); toast('La nota ya no se puede editar (pasaron 24 h)'); return; }
    }
    if(res.error){
      if(!GN_NO_STRUCT && /structured/i.test(res.error.message||'')){ GN_NO_STRUCT=true; g.dirty=true; return gnSaveNow(g); } // fallback: solo content
      throw new Error(res.error.message);
    }
    if(GN===g) gnStatus(g.dirty?'typing':'saved');
  }catch(e){
    console.warn('Nota guiada: no se pudo guardar', e);
    g.dirty=true; if(GN===g){ gnStatus('retry'); clearTimeout(g.timer); g.timer=setTimeout(gnFlush,4000); }
  }
}

/* ---- escritura a la ficha (writeback) ----
   Vacío en la ficha → se completa directo. Valor existente que cambia → se actualiza y queda una entrada
   "Corrección de datos de base" firmada (misma que usa Corregir datos de base) + auditoría por trigger.
   Nunca se borra un dato de la ficha desde una nota. El peso queda además en notes.weight_kg (historial). */
function gnWriteback(col, val){
  const g=GN; if(!g || !g.canWrite || g.pid!==CUR.id) return Promise.resolve();
  g.wchain=(g.wchain||Promise.resolve()).then(()=>gnWritebackNow(g,col,val)).catch(e=>console.warn('writeback',e));   // de a una, en orden
  return g.wchain;
}
async function gnWritebackNow(g, col, val){
  if(g.pid!==CUR.id) return;
  const newS=(val==null?'':(''+val).trim()); if(newS==='') return;
  const oldS=(CUR[col]==null?'':(''+CUR[col]));
  if(oldS===newS) return;
  if(col==='weight_kg'||col==='height_cm'){ if(parseFloat(oldS)===parseFloat(newS)) return; }
  const upd={updated_by:ME.user_id}; upd[col]=(col==='weight_kg'||col==='height_cm')?num(newS):newS;
  const {data,error}=await DB().from('patients').update(upd).eq('id',CUR.id).select().single();
  if(error){ toast('No se pudo actualizar la ficha: '+error.message); return; }
  CUR=data;
  if(oldS==='' ) { g.filled[col]=true; return; }
  if(g.filled[col] || col==='weight_kg') return; // lo completó esta misma nota / el peso queda firmado en la nota
  if(!(col in g.orig)) g.orig[col]=oldS;
  const content=CORR_PREFIX+' · '+(FIELD_LABEL[col]||col)+': «'+g.orig[col]+'» → «'+newS+'»';
  if(g.corr[col]){
    const r=await DB().from('notes').update({content, updated_by:ME.user_id}).eq('id',g.corr[col]).select('id');
    if(!r.error && r.data && r.data.length) return;
  }
  const r=await DB().from('notes').insert({patient_id:CUR.id, discipline:(ROLE_TO_DISC[ME.role]||'oncologia'), content, author_id:ME.user_id, created_by:ME.user_id}).select('id').single();
  if(r.error){ toast('El dato se guardó pero no se pudo registrar la corrección: '+r.error.message); return; }
  g.corr[col]=r.data.id;
}
function gnFieldDef(k){ return tplFields(GN.tpl).find(f=>f.k===k); }
function gnSecOf(k){ return GN.tpl.secs.find(s=>s.f.some(f=>f.k===k)); }
function gnAfterFieldDone(k){
  if(!GN) return;
  const f=gnFieldDef(k), s=gnSecOf(k);
  if(f && f.map) gnWriteback(f.map, GN.data[k]);
  if(s && s.habits) gnWriteback(s.habits, habitsCompile(s,GN.data));
}

/* ---- traer de la visita anterior ---- */
function gnPrevValue(f){
  if(f.map && CUR[f.map]!=null && (''+CUR[f.map]).trim()!=='') return ''+CUR[f.map];   // el valor vigente de la ficha
  const keys=[f.k].concat(f.src||[]);
  const notes=(FCALC&&FCALC.notes)||[];
  for(const n of notes){
    if(n.id===GN.noteId || n.discipline!==GN.tpl.disc || !n.structured || !n.structured.data) continue;
    for(const key of keys){ const v=gnStr(n.structured.data[key]); if(v) return v; }
  }
  return '';
}
function gnPrev(secK){
  const s=GN.tpl.secs.find(x=>x.k===secK); if(!s) return;
  let got=0;
  s.f.filter(f=>f.t==='text').forEach(f=>{
    const v=gnPrevValue(f); if(!v) return;
    const el=document.querySelector('#gn [data-gk="'+f.k+'"]'); if(!el) return;
    const cur=(el.value||'').trim();
    if(cur===v.trim()) { got++; return; }
    el.value = cur ? (cur+'\n'+v) : v; GN.data[f.k]=el.value; got++;
    gnAfterFieldDone(f.k);
  });
  if(!got){ toast('No hay una visita anterior con este campo'); return; }
  gnSchedule(); gnFlush();
}

/* ---- dictado por voz (Web Speech API, es-AR) ---- */
function gnMicUI(){ document.querySelectorAll('#gn .gmic').forEach(b=>b.classList.toggle('on', !!GN_REC && b.dataset.mic===GN_REC_KEY)); }
function gnMic(k){
  if(!GN_SR){ toast('Este navegador no permite dictado por voz'); return; }
  if(GN_REC){ const was=GN_REC_KEY; try{GN_REC.stop();}catch(e){} GN_REC=null; GN_REC_KEY=null; gnMicUI(); if(was===k) return; }
  const el=document.querySelector('#gn [data-gk="'+k+'"]'); if(!el) return;
  const r=new GN_SR(); r.lang='es-AR'; r.continuous=true; r.interimResults=false;
  r.onresult=e=>{ let t=''; for(let i=e.resultIndex;i<e.results.length;i++){ if(e.results[i].isFinal) t+=e.results[i][0].transcript; }
    t=t.trim(); if(!t) return; el.value=(el.value && !/\s$/.test(el.value) ? el.value+' ' : el.value)+t; GN.data[k]=el.value; gnSchedule(); };
  r.onerror=e=>{ if(e.error==='not-allowed'||e.error==='service-not-allowed') toast('Permití el micrófono para dictar'); };
  r.onend=()=>{ if(GN_REC===r){ GN_REC=null; GN_REC_KEY=null; } gnMicUI(); if(GN){ gnAfterFieldDone(k); gnFlush(); } };
  GN_REC=r; GN_REC_KEY=k;
  try{ r.start(); }catch(e){ GN_REC=null; GN_REC_KEY=null; }
  gnMicUI();
}

/* ---- cerrar ---- */
async function gnClose(){
  if(!GN) return;
  if(GN_REC){ try{GN_REC.stop();}catch(e){} GN_REC=null; GN_REC_KEY=null; }
  const g=GN;
  await gnFlush(); await (g.wchain||Promise.resolve());
  if((g.dirty || g.st==='retry') && !confirm('Todavía no se pudo guardar el último cambio (revisá la conexión). ¿Cerrar igual? Lo que ya figuraba como guardado queda en el registro.')) return;
  clearTimeout(g.timer);
  if(g._io) g._io.disconnect();
  GN=null; $('gn').hidden=true; $('gn').innerHTML=''; document.body.classList.remove('gn-open');
  if(g.noteId) toast('Nota guardada en el registro');
  EVOL_FILTER='all'; EVOL_PROF='all';
  await afterChange();
}

/* ---- eventos (delegados) ---- */
(function gnWire(){
  const root=$('gn'); if(!root) return;
  root.addEventListener('input',e=>{
    const el=e.target.closest('[data-gk]'); if(!el||!GN) return;
    GN.data[el.dataset.gk]=el.value;
    const s=gnSecOf(el.dataset.gk); if(s&&s.anthro) gnCalc(s.k);
    gnSchedule();
  });
  root.addEventListener('change',e=>{ const el=e.target.closest('[data-gk]'); if(!el||!GN) return; gnAfterFieldDone(el.dataset.gk); gnFlush(); });
  root.addEventListener('focusout',e=>{ if(e.target.closest('[data-gk]')) gnFlush(); });
  root.addEventListener('click',e=>{
    if(!GN) return;
    const ch=e.target.closest('.gch');
    if(ch){
      const box=ch.closest('[data-chips]'), k=box.dataset.chips, f=gnFieldDef(k), v=ch.dataset.v;
      if(f.multi){ const arr=Array.isArray(GN.data[k])?GN.data[k].slice():[]; const i=arr.indexOf(v); if(i>=0)arr.splice(i,1); else arr.push(v); GN.data[k]=arr; }
      else GN.data[k]=(GN.data[k]===v?'':v);
      const sel=Array.isArray(GN.data[k])?GN.data[k]:[GN.data[k]];
      box.querySelectorAll('.gch').forEach(b=>b.classList.toggle('on', sel.includes(b.dataset.v)));
      gnSchedule(); gnAfterFieldDone(k); return;
    }
    const ib=e.target.closest('[data-ind]'); if(ib){ openInfusionModal((FCALC&&FCALC.inds&&FCALC.inds.length===1)?FCALC.inds[0].id:null, true); return; }
    const pv=e.target.closest('[data-prev]'); if(pv){ gnPrev(pv.dataset.prev); return; }
    const mc=e.target.closest('[data-mic]'); if(mc){ gnMic(mc.dataset.mic); return; }
    const go=e.target.closest('[data-go]'); if(go){ const t=$('gs_'+go.dataset.go); if(t) t.scrollIntoView({behavior:'smooth',block:'start'}); return; }
  });
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden' && GN) gnFlush(); });
  window.addEventListener('beforeunload',e=>{ if(GN && (GN.dirty || GN.st==='saving' || GN.st==='retry')){ gnFlush(); e.preventDefault(); e.returnValue=''; } });
})();

async function addVitcProto(){

  if(comps.some(c=>!c.given&&!c.reason)){ toast('Indicá el motivo de lo que no se dio'); return false; }
  const vc=comps.find(c=>c.given&&/vitamina\s*c\b/.test(normTxt(c.name))&&normTxt(c.unit)==='g');

    administered_by:ME.user_id, created_by:ME.user_id}, signosRec());

/* ---------- Archivos: un PDF, o varias fotos que se unen en un solo PDF ----------
   Se usa en laboratorios, consentimientos y estudios. Las fotos se achican (máx. 1800 px), se pasan a JPEG
   y se arma el PDF en el navegador (una foto por hoja A4, en el orden elegido). No depende de librerías externas. */
const FC={};   // archivos elegidos por formulario: {pdf:File|null, imgs:[{file,url}]}
const DATE_CORR='Corrección de fecha';
const CONSENT_KIND={vitamina_c:'Megadosis de Vitamina C', sueroterapia:'Sueroterapia / infusiones', hc_compartida:'Historia clínica compartida', otro:'Otro'};
let REC={};    // registros mostrados (para corregir fecha o adjuntar archivo)
function fcReset(id){ const c=FC[id]; if(c&&c.imgs) c.imgs.forEach(x=>URL.revokeObjectURL(x.url)); FC[id]={pdf:null, imgs:[]}; }
function fileCollectorHTML(id,label){
  fcReset(id);
  return '<div class="field"><label>'+label+'</label><div class="fc" id="fc_'+id+'"><div class="fc-list" id="fcl_'+id+'"></div>'+
    '<div class="fc-acts"><label class="btn sm"><input type="file" accept="application/pdf,image/*" multiple hidden onchange="fcAdd(\''+id+'\',this)">'+PLUS+'Elegir PDF o fotos</label>'+
    '<label class="btn sm fc-cam"><input type="file" accept="image/*" capture="environment" hidden onchange="fcAdd(\''+id+'\',this)">Sacar foto</label></div>'+
    '<p class="meta fc-hint" id="fch_'+id+'">Un PDF, o una o varias fotos (por ejemplo, una por hoja): las fotos se unen en un solo PDF, en este orden.</p></div></div>';
}
function fcAdd(id,input){
  const c=FC[id]||(FC[id]={pdf:null,imgs:[]});
  const files=[...(input.files||[])]; input.value='';
  for(const f of files){
    const isPdf=f.type==='application/pdf'||/\.pdf$/i.test(f.name);
    if(isPdf){
      if(c.imgs.length||c.pdf||files.filter(x=>x.type==='application/pdf').length>1){ toast('Se puede adjuntar un solo PDF, o varias fotos. Para juntar hojas, usá fotos.'); continue; }
      c.pdf=f;
    } else if((f.type||'').startsWith('image/')||/\.(jpe?g|png|heic|heif|webp)$/i.test(f.name)){
      if(c.pdf){ toast('Ya elegiste un PDF: quitalo para usar fotos.'); continue; }
      if(c.imgs.length>=40){ toast('Hasta 40 fotos por documento'); break; }
      c.imgs.push({file:f, url:URL.createObjectURL(f)});
    } else toast('«'+f.name+'» no es un PDF ni una foto');
  }
  fcRender(id);
}
function fcMove(id,i,d){ const a=FC[id].imgs, j=i+d; if(j<0||j>=a.length) return; [a[i],a[j]]=[a[j],a[i]]; fcRender(id); }
function fcDel(id,i){ const c=FC[id]; if(i<0){ c.pdf=null; } else { URL.revokeObjectURL(c.imgs[i].url); c.imgs.splice(i,1); } fcRender(id); }
function fcRender(id){
  if(id==='lab') LAB_BUILT=null;   // cambió la selección: hay que volver a armar el PDF
  const el=$('fcl_'+id), c=FC[id]; if(!el||!c) return;
  const mb=b=>(b/1024/1024).toFixed(1).replace('.',',')+' MB';
  el.innerHTML=c.pdf
    ? '<div class="fc-pdf">'+FILE_ICO+'<span>'+esc(c.pdf.name)+' · '+mb(c.pdf.size)+'</span><button type="button" class="btn sm" aria-label="Quitar" onclick="fcDel(\''+id+'\',-1)">✕</button></div>'
    : c.imgs.map((x,i)=>'<div class="fc-img"><img src="'+x.url+'" alt="Hoja '+(i+1)+'"><span class="fc-n">'+(i+1)+'</span>'+
        '<div class="fc-b"><button type="button" aria-label="Subir" onclick="fcMove(\''+id+'\','+i+',-1)">↑</button><button type="button" aria-label="Bajar" onclick="fcMove(\''+id+'\','+i+',1)">↓</button><button type="button" aria-label="Quitar" onclick="fcDel(\''+id+'\','+i+')">✕</button></div></div>').join('');
  const h=$('fch_'+id); if(h) h.textContent=c.imgs.length>1?(c.imgs.length+' fotos: se van a unir en un PDF de '+c.imgs.length+' hojas, en este orden.'):(c.pdf?'Se sube el PDF tal cual.':'Un PDF, o una o varias fotos (por ejemplo, una por hoja): las fotos se unen en un solo PDF, en este orden.');
}
function fcHas(id){ const c=FC[id]; return !!(c&&(c.pdf||c.imgs.length)); }
async function imgToJpeg(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error('No se pudo leer la foto «'+file.name+'». Usá fotos JPG o PNG.')); i.src=url; });
    const sc=Math.min(1, 1800/Math.max(img.naturalWidth,img.naturalHeight));
    const w=Math.max(1,Math.round(img.naturalWidth*sc)), h=Math.max(1,Math.round(img.naturalHeight*sc));
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
    const cx=cv.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,w,h); cx.drawImage(img,0,0,w,h);
    const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.82));
    return {bytes:new Uint8Array(await blob.arrayBuffer()), w, h};
  } finally { URL.revokeObjectURL(url); }
}
function jpegsToPdf(pages){   // PDF 1.4 mínimo: una imagen JPEG por hoja A4, centrada
  const enc=new TextEncoder(), parts=[], offs=[]; let len=0;
  const put=x=>{ const b=(typeof x==='string')?enc.encode(x):x; parts.push(b); len+=b.length; };
  const obj=(n,fn)=>{ offs[n]=len; put(n+' 0 obj\n'); fn(); put('\nendobj\n'); };
  put('%PDF-1.4\n'); put(new Uint8Array([37,226,227,207,211,10]));
  const n=pages.length, total=2+3*n, kids=pages.map((_,i)=>(3+3*i)+' 0 R').join(' ');
  obj(1,()=>put('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>put('<< /Type /Pages /Kids ['+kids+'] /Count '+n+' >>'));
  pages.forEach((p,i)=>{
    const pg=3+3*i, im=pg+1, ct=pg+2, land=p.w>p.h, pw=land?841.89:595.28, ph=land?595.28:841.89, m=18;
    const s=Math.min((pw-2*m)/p.w,(ph-2*m)/p.h), dw=p.w*s, dh=p.h*s, x=(pw-dw)/2, y=(ph-dh)/2;
    const cs='q '+dw.toFixed(2)+' 0 0 '+dh.toFixed(2)+' '+x.toFixed(2)+' '+y.toFixed(2)+' cm /Im0 Do Q';
    obj(pg,()=>put('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+pw+' '+ph+'] /Resources << /XObject << /Im0 '+im+' 0 R >> >> /Contents '+ct+' 0 R >>'));
    obj(im,()=>{ put('<< /Type /XObject /Subtype /Image /Width '+p.w+' /Height '+p.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+p.bytes.length+' >>\nstream\n'); put(p.bytes); put('\nendstream'); });
    obj(ct,()=>put('<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream'));
  });
  const xref=len;
  put('xref\n0 '+(total+1)+'\n0000000000 65535 f \n');
  for(let k=1;k<=total;k++) put(String(offs[k]).padStart(10,'0')+' 00000 n \n');
  put('trailer\n<< /Size '+(total+1)+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF\n');
  return new Blob(parts,{type:'application/pdf'});
}
async function fcBuild(id, baseName){   // → {blob,name,type} o null si no eligió nada
  const c=FC[id]; if(!c) return null;
  if(c.pdf) return {blob:c.pdf, name:c.pdf.name, type:'application/pdf'};
  if(!c.imgs.length) return null;
  const pages=[]; for(const x of c.imgs) pages.push(await imgToJpeg(x.file));
  return {blob:jpegsToPdf(pages), name:(baseName||'documento')+'_'+c.imgs.length+'_hojas.pdf', type:'application/pdf'};
}
async function uploadBuilt(built, prefix){

}

let LAB_BUILT=null;   // el PDF ya armado para leer, se reutiliza al guardar
async function readLabFile(){
  const msg=$('lbReadMsg'), btn=$('lbRead');
  if(!fcHas('lab')){ if(msg){msg.style.color='var(--alert)';msg.textContent='Elegí primero el PDF o las fotos del laboratorio.';} return; }
  btn.disabled=true; if(msg){msg.style.color='';msg.textContent=FC.lab.imgs.length?'Uniendo las fotos y leyendo el laboratorio…':'Leyendo el laboratorio…';}
  try{
    const b=await fcBuild('lab','laboratorio'); LAB_BUILT=b;
    if(b.blob.size>8*1024*1024){ if(msg){msg.style.color='var(--alert)';msg.textContent='Para la lectura automática el archivo debe pesar menos de 8 MB. Cargá los valores a mano.';} btn.disabled=false; return; }
    const b64=await fileToBase64(b.blob);
    const resp=await SB.functions.invoke('read-lab',{body:{fileBase64:b64, mediaType:b.type||'application/pdf'}});
    if(resp.error){ if(msg){msg.style.color='var(--crit)';msg.textContent='No se pudo leer automáticamente. Cargá los valores a mano.';} btn.disabled=false; return; }
    const d=resp.data||{};
    if(d.error){ if(msg){msg.style.color='var(--crit)';msg.textContent=d.error;} btn.disabled=false; return; }
    const v=d.values||{};
    const setv=(id,val)=>{const e=$(id); if(e&&val!=null&&val!=='') e.value=val;};
    if(v.measured_at) setv('lbDate', String(v.measured_at).slice(0,10));
    setv('lbHb',v.hemoglobina);setv('lbHto',v.hematocrito);setv('lbGb',v.leucocitos);setv('lbPlaq',v.plaquetas);
    setv('lbGluc',v.glucemia);setv('lbCreat',v.creatinina);setv('lbUrea',v.urea);setv('lbOtros',v.otros);
    if(msg){msg.style.color='var(--vital)';msg.textContent='Listo. Revisá los valores y la fecha antes de guardar.';}
  }catch(e){ if(msg){msg.style.color='var(--crit)';msg.textContent=e.message||'No se pudo leer el archivo. Cargá los valores a mano.';} }
  btn.disabled=false;
}
async function addLab(){
  const g=id=>{const e=$(id);return e&&e.value!==''?e.value:null;};
  const hasFile=fcHas('lab');
  if(!hasFile && !['lbHb','lbHto','lbGb','lbPlaq','lbGluc','lbCreat','lbUrea','lbOtros'].some(id=>g(id)!=null)){ toast('Cargá al menos un valor o adjuntá el archivo'); return false; }
  const day=$('lbDate').value||todayLocal();
  const sameLab=(FCALC.labs||[]).find(l=>ymd(new Date(l.measured_at))===day);
  if(sameLab){
    const vals=ANALITOS.filter(a=>sameLab[a[0]]!=null).map(a=>a[1]+' '+sameLab[a[0]]).join(' · ');
    const ch=await askChoice({where:'Al cargar un laboratorio', title:'Ya hay un laboratorio del '+fmt(day), existing:'Laboratorio · '+fmt(sameLab.measured_at), detail:(vals||'Sin valores cargados')+(sameLab.storage_path?' · con archivo adjunto':''),
      why:'Si es el mismo análisis, no hace falta cargarlo otra vez.', primary:'Ver el que ya está', secondary:'Es otro análisis'});
    if(ch==='primary'){ modalClose(); DOC_TAB='labs'; setTab('docs'); return false; }
    if(ch!=='secondary') return false;
  }
  let sp=null;
  if(hasFile){ try{ const b=LAB_BUILT||await fcBuild('lab','laboratorio'); sp=await uploadBuilt(b,'lab_'); }catch(e){ toast(e.message); return false; } }
  const rec={patient_id:CUR.id, recorded_by:ME.user_id, storage_path:sp, measured_at:noonISO(day),
    hemoglobina:g('lbHb'),hematocrito:g('lbHto'),leucocitos:g('lbGb'),plaquetas:g('lbPlaq'),glucemia:g('lbGluc'),creatinina:g('lbCreat'),urea:g('lbUrea'),otros:g('lbOtros'),notes:g('lbNotes')};
  const {error}=await DB().from('labs').insert(rec); if(error){ dropUpload(sp); toast(error.message); return false; }
  LAB_BUILT=null; fcReset('lab');
  toast('Laboratorio guardado'); DOC_TAB='labs'; afterChange(); return true;
}

/* ---------- Corregir la fecha de un laboratorio, consentimiento o estudio ----------
   Queda el rastro: entrada firmada «Corrección de fecha» en el registro + auditoría (valor anterior y nuevo). */
function recInfo(kind,id){
  const r=REC[kind+id]; if(!r) return null;
  if(kind==='lab') return {r, by:r.recorded_by, label:'Laboratorio', cur:ymd(new Date(r.measured_at)), field:'Fecha del análisis'};
  if(kind==='consent') return {r, by:r.created_by, label:'Consentimiento · '+(CONSENT_KIND[r.kind]||r.kind), cur:r.signed_at?ymd(sigDate(r.signed_at)):'', field:'Fecha de firma'};
  return {r, by:r.uploaded_by, label:'Estudio «'+(r.title||'documento')+'»', cur:r.study_date||'', field:'Fecha del estudio'};
}
function openDateFix(kind,id){
  const it=recInfo(kind,id); if(!it) return;
  if(!canFix(it.by)){ toast('Solo quien lo cargó o la dirección médica pueden corregirlo'); return; }
  modalOpen('Corregir fecha',
    '<p class="meta" style="margin:0">'+esc(it.label)+'. Queda registrado en la historia: la fecha anterior, la nueva, quién la cambió y cuándo.</p>'+
    '<div class="field"><label>'+esc(it.field)+'</label><input id="dfDate" type="date" value="'+esc(it.cur)+'" max="'+todayLocal()+'"></div>','Guardar fecha', async ()=>{
      const d=$('dfDate').value; if(!d){ toast('Elegí la fecha'); return false; }
      if(d===it.cur){ toast('Es la misma fecha'); return false; }
      let error;
      if(kind==='lab') ({error}=await DB().rpc('update_lab',{p_id:id, p_measured_at:noonISO(d), p_storage_path:null}));
      else if(kind==='consent'){ const r=await DB().from('consents').update({signed_at:noonISO(d)}).eq('id',id).select('id'); error=r.error||((!r.data||!r.data.length)?{message:'No se pudo guardar'}:null); }
      else { const r=await DB().from('attachments').update({study_date:d}).eq('id',id).select('id'); error=r.error||((!r.data||!r.data.length)?{message:'No se pudo guardar'}:null); }
      if(error){ toast(error.message); return false; }
      await DB().from('notes').insert({patient_id:CUR.id, discipline:(ROLE_TO_DISC[ME.role]||'oncologia'), author_id:ME.user_id, created_by:ME.user_id,
        content:DATE_CORR+' · '+it.label+': «'+(it.cur?fmt(it.cur):'sin fecha')+'» → «'+fmt(d)+'»'});
      toast('Fecha corregida'); afterChange(); return true;
    });
}
/* adjuntar el PDF o las fotos a un laboratorio o consentimiento que se guardó sin archivo */
function openAttachLater(kind,id){
  const it=recInfo(kind,id); if(!it) return;
  if(!canFix(it.by)){ toast('Solo quien lo cargó o la dirección médica pueden adjuntarle el archivo'); return; }
  modalOpen('Adjuntar archivo', '<p class="meta" style="margin:0">'+esc(it.label)+(it.cur?' · '+fmt(it.cur):'')+'</p>'+fileCollectorHTML('later','Archivo'),'Adjuntar', async ()=>{
    if(!fcHas('later')){ toast('Elegí el PDF o las fotos'); return false; }
    let sp; try{ sp=await uploadBuilt(await fcBuild('later', kind==='lab'?'laboratorio':'consentimiento'), kind==='lab'?'lab_':'consent_'); }catch(e){ toast(e.message); return false; }
    let error;
    if(kind==='lab') ({error}=await DB().rpc('update_lab',{p_id:id, p_measured_at:null, p_storage_path:sp}));
    else { const r=await DB().from('consents').update({storage_path:sp}).eq('id',id).select('id'); error=r.error||((!r.data||!r.data.length)?{message:'No se pudo guardar'}:null); }
    if(error){ dropUpload(sp); toast(error.message); return false; }
    fcReset('later'); toast('Archivo adjuntado'); afterChange(); return true;
  });
}

/* ---------- Infusiones con varios componentes ----------
   Una indicación de infusión (kind 'infusion') = un protocolo: componentes del catálogo (indication_components),
   vehículo, volumen (vitc_dilution_ml), goteo (vitc_rate_gtt_min), frecuencia, fechas y sesiones.
   Puede haber varios protocolos vigentes a la vez. Las indicaciones viejas 'vitamina_c' se leen como un protocolo
   de un solo componente. Nada se borra: modificar crea una versión nueva y la anterior queda reemplazada. */
let CATALOG=null, TEMPLATES=null, INF=null, IND_FROM_NOTE=false;
const CAT_ORDER=['Vitaminas','Antioxidantes','Minerales','Aminoácidos','Otros'];
async function loadCatalog(force){
  if(CATALOG&&!force) return CATALOG;
  const [C,T]=await Promise.all([DB().from('infusion_components').select('*').order('name'), DB().from('infusion_templates').select('*').order('name')]);
  CATALOG=C.data||[]; TEMPLATES=T.data||[];
  return CATALOG;
}
function normTxt(s){ return (s||'').toString().normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim(); }
function catOf(id){ return (CATALOG||[]).find(c=>c.id===id)||null; }
function catVitC(){ return (CATALOG||[]).find(c=>c.active && /^vitamina\s*c\b/.test(normTxt(c.name)))||null; }   // la base de casi todos los protocolos
function indComps(i){ return i.kind==='vitamina_c' ? [{component_id:null,name:'Vitamina C',unit:'g',dose:i.vitc_target_dose_g}] : (i.comps||[]); }
function compG6pd(c){ const k=c.component_id?catOf(c.component_id):null; return !!(k&&k.g6pd_alert) || /vitamina\s*c\b/.test(normTxt(c.name)); }
function indG6pd(i){ return indComps(i).some(compG6pd); }
function compTxt(c){ return c.name+((c.dose!=null&&c.dose!=='')?' '+c.dose+' '+c.unit:''); }
function indTitle(i){
  if(i.protocol_name) return i.protocol_name;
  if(i.kind==='vitamina_c') return 'Megadosis de vitamina C';
  const c=indComps(i); return c.length?c.map(x=>x.name).join(' + '):'Infusión';
}
function indSummary(i){
  if(i.kind==='general') return 'Indicación general';
  return [indComps(i).map(compTxt).join(' + ')||indTitle(i), i.vitc_frequency?(FREQ_LABEL[i.vitc_frequency]||i.vitc_frequency):'',
    i.vitc_dilution_ml?(i.vitc_dilution_ml+' ml'+(i.vehicle?' de '+i.vehicle:'')):(i.vehicle||''), i.vitc_rate_gtt_min?i.vitc_rate_gtt_min+' gtt/min':''].filter(Boolean).join(' · ');
}
function infDuration(vol,rate){
  vol=parseFloat(vol); rate=parseFloat(rate); if(!(vol>0&&rate>0)) return '';
  const m=Math.round(vol*20/rate); return 'Duración estimada '+Math.floor(m/60)+' h '+(m%60)+' min (macrogotero, 20 gtt/ml)';
}
function adminsOf(i){   // infusiones registradas de un protocolo (las viejas sin protocolo cuentan para la megadosis vigente desde su inicio)
  const from=toDate(i.start_date||i.created_at).getTime();
  return (FCALC.vitc||[]).filter(v=>!v.deleted_at && (v.indication_id===i.id || (i.kind==='vitamina_c' && !v.indication_id && new Date(v.administered_at).getTime()>=from)));
}
function adminCompsTxt(v){
  const gv=(FCALC&&FCALC.given&&FCALC.given[v.id])||null;
  return (gv&&gv.length) ? gv.filter(c=>c.given).map(compTxt).join(' + ') : (v.dose_g+' g de vitamina C');
}
function indStatus(i){
  if(i.active) return '<span class="st ok"><span class="d"></span>Vigente</span>';
  if(i.suspended_at) return '<span class="st warn"><span class="d"></span>Suspendida el '+fmtDMShort(i.suspended_at)+(i.suspended_by?' por '+esc(lastNameOf(whoName(i.suspended_by))):'')+(i.suspend_reason?' · '+esc(i.suspend_reason):'')+'</span>';
  if(i.replaced_by) return '<span class="st off"><span class="d"></span>Reemplazada por una indicación posterior</span>';
  return '<span class="st off"><span class="d"></span>Inactiva</span>';
}
function renderIndCard(host){
  if(!host) return;
  const inds=FCALC.inds||[], ci=can.indicate(), g=CUR.g6pd_status||'no_evaluado';
  const head='<div class="sec-h" style="margin:0 2px 10px"><span class="sec-t">Infusiones vigentes · '+inds.length+'</span>'+(ci?'<button class="btn primary sm" onclick="openInfusionModal()">'+PLUS+'Indicar infusión</button>':'')+'</div>';
  if(!inds.length){
    host.innerHTML=head+'<section class="card"><div class="sec"><p class="meta" style="margin:0">'+(ci?'No hay infusiones indicadas. Elegí los componentes del catálogo, el vehículo, el goteo y la frecuencia: enfermería los ve precargados en cada infusión.':'No hay infusiones indicadas. Las indican la dirección médica, oncología y el médico funcional.')+'</p></div></section>';
    return;
  }
  host.innerHTML=head+'<div class="stack">'+inds.map(i=>indCardHTML(i,ci,g)).join('')+'</div>';
}
function indCardHTML(ind,ci,g){
  const ads=adminsOf(ind), done=ads.length, last=ads[0]||null;
  let prox=''; if(ind.vitc_frequency&&last){ const iv=FREQ_DAYS[ind.vitc_frequency]||7; prox=fmtDMShort(new Date(new Date(last.administered_at).getTime()+iv*86400000).toISOString()); }
  const sessDone=ind.sessions_planned && done>=ind.sessions_planned, dateDone=ind.end_date && daysSince(ind.end_date)>=1;
  const warnEnd=(sessDone||dateDone)?'<div class="gate" style="margin-top:12px"><span class="ic"></span><p><b style="color:var(--ink)">'+(sessDone?'Se completaron las '+ind.sessions_planned+' sesiones indicadas.':'La indicación terminó el '+fmt(ind.end_date)+'.')+'</b> Revisá si se renueva, se modifica o se suspende.</p></div>':'';
  const g6=(indG6pd(ind)&&g!=='normal')?'<div class="gate" style="margin-top:12px"><span class="ic"></span><p><b style="color:var(--ink)">'+esc(G6PD_LABEL[g])+'.</b> Este protocolo tiene un componente con aviso de G6PD (riesgo de hemólisis): verificá antes de administrar.</p></div>':'';
  const comps=indComps(ind).map(c=>'<div class="ic-row"><span class="d"></span><span class="n">'+esc(c.name)+'</span><span class="v">'+((c.dose!=null&&c.dose!=='')?esc(c.dose)+' '+esc(c.unit):'—')+'</span></div>').join('');
  const veh=[ind.vitc_dilution_ml?(esc(ind.vitc_dilution_ml)+' ml'+(ind.vehicle?' de '+esc(ind.vehicle):'')):(ind.vehicle?esc(ind.vehicle):''), ind.vitc_rate_gtt_min?esc(ind.vitc_rate_gtt_min)+' gtt/min':''].filter(Boolean).join(' · ');
  const dur=infDuration(ind.vitc_dilution_ml, ind.vitc_rate_gtt_min);
  const row=(k,v)=>'<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>';
  return '<section class="card"><div class="sec"><div class="sec-h" style="margin-bottom:10px"><span class="sec-t">'+esc(indTitle(ind))+'</span><span class="st ok"><span class="d"></span>'+esc(ind.vitc_frequency?(FREQ_LABEL[ind.vitc_frequency]||ind.vitc_frequency):'Vigente')+'</span></div>'+
    '<div class="ic-list">'+comps+'</div>'+
    ((veh||dur)?'<p class="meta" style="margin:10px 0 0;line-height:1.6">'+veh+(dur?'<br>'+esc(dur):'')+'</p>':'')+
    '<div class="rows" style="margin-top:8px">'+
      row('Sesiones',done+(ind.sessions_planned?' de '+ind.sessions_planned:'')+' realizada'+(done===1&&!ind.sessions_planned?'':'s'))+
      row('Última',last?fmtDMShort(last.administered_at)+' · '+fmtHM(last.administered_at):'—')+
      (prox?row('Próxima sugerida','<span style="color:var(--vital)">'+prox+'</span>'):'')+
      (ind.end_date?row('Hasta',fmt(ind.end_date)):'')+
      row('Indicó',esc(lastNameOf(whoName(ind.prescribed_by)))+' · desde el '+fmtDMShort(ind.start_date||ind.created_at))+'</div>'+
    (ind.detail?'<p class="bd" style="margin-top:12px">'+esc(ind.detail)+'</p>':'')+g6+warnEnd+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">'+
      (can.vitc()?'<button class="btn sm btn-inf" onclick="openVitcModal(\''+ind.id+'\')">Registrar infusión</button>':'')+
      (ci?'<button class="btn sm" onclick="openInfusionModal(\''+ind.id+'\')">Modificar</button><button class="btn sm dg" onclick="openSuspendInd(\''+ind.id+'\')">Suspender</button>':'')+
    '</div></div></section>';
}
async function renderIndic(hostEl){
  const host=hostEl||$('paneHost');
  const [I,C]=await Promise.all([DB().from('indications').select('*').eq('patient_id',CUR.id).order('created_at',{ascending:false}), DB().from('indication_components').select('*').eq('patient_id',CUR.id)]);
  const byInd=groupBy(C.data||[],'indication_id');
  const rows=(I.data||[]).filter(i=>!i.deleted_at).map(i=>{ i.comps=byInd[i.id]||[];
    return '<div class="entry"><div class="eh">'+indStatus(i)+'<span class="au">'+esc(i.kind==='general'?'Indicación general':indTitle(i))+'</span>'+
      '<span class="meta" style="margin-left:auto">'+fmtDMShort(i.created_at)+' · '+esc(lastNameOf(whoName(i.prescribed_by)))+'</span></div>'+
      (i.kind!=='general'?'<p class="bd">'+esc(indSummary(i))+'</p>':'')+(i.detail?'<p class="bd">'+esc(i.detail)+'</p>':'')+'</div>'; }).join('');
  host.innerHTML='<div class="sec-h" style="margin:6px 2px 10px"><span class="sec-t">Historial de indicaciones</span>'+(can.indicate()?'<button class="btn sm" onclick="openIndicModal()">'+PLUS+'Indicación general</button>':'')+'</div>'+
    (rows?'<section class="sheet">'+rows+'</section>':'<div class="empty" style="padding:28px 12px"><p>Sin indicaciones cargadas.</p></div>');
}

/* indicación general (texto) */
function openIndicModal(){
  if(!can.indicate()){ toast('Las indicaciones las cargan la dirección médica, oncología y el médico funcional'); return; }
  modalOpen('Nueva indicación general',
    '<div class="field"><label>Indicación *</label><textarea id="iDetail" placeholder="Indicación, aclaraciones, controles…"></textarea></div>','Guardar indicación', addIndic);
}
async function addIndic(){
  const detail=($('iDetail').value||'').trim(); if(!detail){ toast('Escribí la indicación'); return false; }
  const {data:act}=await DB().from('indications').select('id,detail,created_at,prescribed_by').eq('patient_id',CUR.id).eq('kind','general').eq('active',true);
  const same=(act||[]).find(i=>normTxt(i.detail)===normTxt(detail));
  if(same){
    const ch=await askChoice({where:'Al cargar una indicación', title:'Esa indicación ya está vigente', existing:'Indicación general · '+fmtDMShort(same.created_at), detail:'Indicó '+whoName(same.prescribed_by), why:'Repetirla la mostraría dos veces en el historial.', primary:'No cargarla de nuevo', secondary:'Cargarla igual'});
    if(ch!=='secondary') return false;
  }
  const {error}=await DB().from('indications').insert({patient_id:CUR.id, kind:'general', detail, prescribed_by:ME.user_id, created_by:ME.user_id, active:true});
  if(error){ toast(error.message); return false; }
  toast('Indicación guardada'); afterChange(); return true;
}

/* indicar / modificar una infusión */
async function openInfusionModal(prevId, fromNote){
  if(!can.indicate()){ toast('Las infusiones las indican la dirección médica, oncología y el médico funcional'); return; }
  await loadCatalog();
  const prev=prevId?(FCALC.inds||[]).find(i=>i.id===prevId)||null:null;
  const cat=(CATALOG||[]).filter(c=>c.active);
  const rowsFrom=i=>indComps(i).map(c=>{
    const k=c.component_id?catOf(c.component_id):cat.find(x=>normTxt(x.name)===normTxt(c.name));
    return k?{component_id:k.id, dose:(c.dose!=null?String(c.dose):'')}:{component_id:'', legacy:true, name:c.name, unit:c.unit, dose:(c.dose!=null?String(c.dose):'')};
  });
  INF={prevId:prev?prev.id:null, fromNote:!!fromNote, name:prev?(prev.protocol_name||''):'',
    rows:prev?rowsFrom(prev):(catVitC()?[{component_id:catVitC().id, dose:catVitC().usual_dose!=null?String(catVitC().usual_dose):''}]:[{component_id:'',dose:''}]),
    vehicle:prev?(prev.vehicle||''):'Solución fisiológica 0,9 %', vol:prev&&prev.vitc_dilution_ml!=null?String(prev.vitc_dilution_ml):'', rate:prev&&prev.vitc_rate_gtt_min!=null?String(prev.vitc_rate_gtt_min):'',
    freq:prev?(prev.vitc_frequency||''):'', start:todayLocal(), sess:prev&&prev.sessions_planned!=null?String(prev.sessions_planned):'', end:prev?(prev.end_date||''):'', detail:prev?(prev.detail||''):'', saveTpl:false};
  modalOpen(prev?'Modificar infusión':'Indicar infusión','<div id="infForm"></div>','Guardar indicación', saveInfusion);
  renderInfForm();
}
function infSet(k,i,v){ if(!INF) return; if(i==null) INF[k]=v; else INF.rows[i][k]=v; }
function infSetComp(i,id){ const r=INF.rows[i], c=catOf(id); r.component_id=id; if(c && (r.dose==null||r.dose==='') && c.usual_dose!=null) r.dose=String(c.usual_dose); renderInfForm(); }
function infAdd(){ INF.rows.push({component_id:'',dose:''}); renderInfForm(); }
function infAddVitC(){ const v=catVitC(); if(!v) return; const empty=INF.rows.find(r=>!r.legacy&&!r.component_id); if(empty){ empty.component_id=v.id; } else INF.rows.unshift({component_id:v.id, dose:v.usual_dose!=null?String(v.usual_dose):''}); renderInfForm(); }
function infDel(i){ INF.rows.splice(i,1); if(!INF.rows.length) INF.rows.push({component_id:'',dose:''}); renderInfForm(); }
function infTpl(id){
  const t=(TEMPLATES||[]).find(x=>x.id===id); if(!t) return;
  INF.rows=(t.components||[]).filter(c=>catOf(c.component_id)).map(c=>({component_id:c.component_id, dose:c.dose!=null?String(c.dose):''}));
  if(!INF.rows.length) INF.rows=[{component_id:'',dose:''}];
  if(t.vehicle) INF.vehicle=t.vehicle; if(t.volume_ml!=null) INF.vol=String(t.volume_ml); if(t.rate_gtt_min!=null) INF.rate=String(t.rate_gtt_min);
  if(!INF.name) INF.name=t.name;
  renderInfForm();
}
function infChosen(){
  return INF.rows.map(r=>{ if(r.legacy) return {component_id:null,name:r.name,unit:r.unit,dose:r.dose}; const c=catOf(r.component_id); return c?{component_id:c.id,name:c.name,unit:c.unit,dose:r.dose,cat:c}:null; }).filter(Boolean);
}

async function saveInfusion(){
  if(!INF) return false;
  const rows=infChosen().map(c=>({component_id:c.component_id, name:c.name, unit:c.unit, dose:num(String(c.dose??'').replace(',','.').trim())}));
  if(!rows.length){ toast('Agregá al menos un componente'); return false; }
  if(rows.some(r=>r.dose!=null&&isNaN(r.dose))){ toast('Revisá las dosis: solo números'); return false; }
  const sinDosis=rows.filter(r=>r.dose==null);
  if(sinDosis.length){ toast('Completá la dosis de: '+sinDosis.map(r=>r.name).join(', ')); return false; }
  if(!INF.freq){ toast('Elegí la frecuencia'); return false; }
  const key=rows.map(c=>c.component_id||normTxt(c.name)).sort().join('|');
  const same=(FCALC.inds||[]).find(i=>i.id!==INF.prevId && indComps(i).map(c=>c.component_id||normTxt(c.name)).sort().join('|')===key);
  if(same){
    const ch=await askChoice({where:'Al indicar una infusión', title:'Ya hay un protocolo vigente con estos componentes', existing:indTitle(same), detail:indSummary(same), why:'Si cambia algo, conviene modificar ese en lugar de tener dos vigentes.', primary:'Volver y revisar', secondary:'Indicar otro igual'});
    if(ch!=='secondary') return false;
  }
  const vc=rows.find(r=>/vitamina\s*c\b/.test(normTxt(r.name))&&normTxt(r.unit)==='g');
  const rec={patient_id:CUR.id, kind:'infusion', protocol_name:INF.name.trim()||null, vehicle:INF.vehicle.trim()||null,
    vitc_dilution_ml:num(INF.vol), vitc_rate_gtt_min:num(INF.rate), vitc_frequency:INF.freq, start_date:INF.start||null, end_date:INF.end||null,
    sessions_planned:num(INF.sess), detail:INF.detail.trim()||null, vitc_target_dose_g:vc?vc.dose:null,
    prescribed_by:ME.user_id, created_by:ME.user_id, active:true};
  const {data,error}=await DB().from('indications').insert(rec).select('id').single();
  if(error){ toast(error.message); return false; }
  const {error:e2}=await DB().from('indication_components').insert(rows.map(r=>Object.assign({indication_id:data.id, patient_id:CUR.id}, r)));
  if(e2){   // sin componentes la indicación no sirve: queda inactiva (no se borra) y se avisa
    await DB().from('indications').update({active:false, updated_by:ME.user_id}).eq('id',data.id);
    toast('No se pudieron guardar los componentes: '+e2.message); return false;
  }
  if(INF.prevId){
    const {error:e3}=await DB().from('indications').update({active:false, replaced_by:data.id, updated_by:ME.user_id}).eq('id',INF.prevId);
    if(e3) toast('La indicación nueva se guardó, pero no se pudo cerrar la anterior: '+e3.message);
  }
  if(INF.saveTpl && can.catalog()){
    await DB().from('infusion_templates').insert({name:rec.protocol_name||rows.map(r=>r.name).join(' + '), components:rows.filter(r=>r.component_id).map(r=>({component_id:r.component_id, dose:r.dose})), vehicle:rec.vehicle, volume_ml:rec.vitc_dilution_ml, rate_gtt_min:rec.vitc_rate_gtt_min});
    loadCatalog(true);
  }
  toast(INF.prevId?'Infusión modificada':'Infusión indicada');
  if(INF.fromNote && GN) gnAppendPlan('Indicación de infusión: '+indSummary(Object.assign({comps:rows}, rec))+'.');
  INF=null; afterChange(); return true;
}
function openSuspendInd(id){
  const ind=(FCALC.inds||[]).find(i=>i.id===id); if(!ind||!can.indicate()) return;
  modalOpen('Suspender infusión',

    'Suspender', async ()=>{

      if(error){ toast(error.message); return false; }

/* desde la nota guiada: el cambio de indicación queda escrito en «Ajuste del plan» de la nota */
function gnAppendPlan(txt){
  if(!GN) return;

/* ---------- Aviso de posible carga repetida (no bloquea: el usuario elige) ---------- */
function askChoice(o){
  return new Promise(res=>{
    const el=$('ask'); if(!el){ res(confirm(o.title+'\n\n'+(o.why||''))?'secondary':'primary'); return; }
    el.innerHTML='<div class="ask-card" role="dialog" aria-modal="true" aria-label="'+esc(o.title)+'">'+
      (o.where?'<div class="ask-w">'+esc(o.where)+'</div>':'')+'<div class="ask-t">'+esc(o.title)+'</div>'+
      (o.existing?'<div class="ask-x"><b>'+esc(o.existing)+'</b>'+(o.detail?'<div>'+esc(o.detail)+'</div>':'')+'</div>':'')+
      (o.why?'<p class="ask-y">'+esc(o.why)+'</p>':'')+
      '<div class="ask-b"><button class="btn primary" id="askP">'+esc(o.primary)+'</button><button class="btn" id="askS">'+esc(o.secondary)+'</button></div></div>';
    el.hidden=false;
    const done=v=>{ el.hidden=true; el.innerHTML=''; el.onclick=null; res(v); };
    $('askP').onclick=()=>done('primary'); $('askS').onclick=()=>done('secondary');
    el.onclick=e=>{ if(e.target===el) done(null); };
    $('askP').focus();
  });
}

async function saveCatItem(id){

function auditDiff(a){
  if(a.action!=='UPDATE'||!a.old_data||!a.new_data) return '';
  const o=a.old_data,n=a.new_data,ch=[];
  Object.keys(n).forEach(k=>{
    if(['updated_at','updated_by','created_at','created_by'].includes(k))return;
    const ov=o[k]==null?'':(''+o[k]), nv=n[k]==null?'':(''+n[k]);
    if(ov!==nv){ const L=FIELD_LABEL[k]||k; ch.push(esc(L)+': '+(ov?esc(ov):'(vacío)')+' → '+(nv?esc(nv):'(vacío)')); }
  });
  return ch.length?'<p class="bd meta" style="font-size:13px">'+ch.join(' · ')+'</p>':'';
}

function gcalLink(ap, patientName){
  const s=new Date(ap.starts_at), e=ap.ends_at?new Date(ap.ends_at):new Date(new Date(ap.starts_at).getTime()+30*60000);
  const f=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
  const text=encodeURIComponent('REVIGEN · '+(ap.title||'Turno')+' — '+(patientName||''));
  const details=encodeURIComponent((ap.discipline?('Disciplina: '+(DISC_LABEL[ap.discipline]||ap.discipline)+'\n'):'')+(ap.notes||''));
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+text+'&dates='+f(s)+'/'+f(e)+'&details='+details;
}

async function createAppt(){

  const t0=new Date(start).getTime();

    .gte('starts_at',new Date(t0-60*60000).toISOString()).lte('starts_at',new Date(t0+60*60000).toISOString());

    const a=near[0];
    const ch=await askChoice({where:'Al dar un turno', title:'La paciente ya tiene un turno a esa hora', existing:fmtDTShort(a.starts_at)+' · '+(DISC_LABEL[a.discipline]||a.title||'Turno'), detail:(DIR[a.professional_id]?'Con '+DIR[a.professional_id].full_name+' · ':'')+a.status,

    if(ch!=='secondary') return false;
  }

  const {error}=await DB().from('appointments').insert(rec); if(error){toast(error.message);return false;}
  toast('Turno creado'); if(curView==='agenda') renderAgenda(); else if(curView==='ficha') afterChange(); return true;
}

    let btn='';
    if(s.user_id!==ME.user_id){
      if(s.is_active) btn='<button class="btn sm dg" onclick="setActive(\''+s.user_id+'\',false,true)">Desactivar</button>';
      else if(pend) btn='<button class="btn primary sm" onclick="setActive(\''+s.user_id+'\',true,false)">Aprobar</button>';
      else btn='<button class="btn sm" onclick="setActive(\''+s.user_id+'\',true,true)">Reactivar</button>';
    }else btn='<span class="meta">Vos</span>';
    const roleSel='<select onchange="setRole(\''+s.user_id+'\',this.value)" '+(s.user_id===ME.user_id?'disabled':'')+'>'+
      Object.entries(ROLE_LABEL).map(([v,t])=>'<option value="'+v+'" '+(s.role===v?'selected':'')+'>'+t+'</option>').join('')+'</select>';
    return '<tr><td><div class="who"><span class="av">'+esc(initials(s.full_name))+'</span><span><span class="nm">'+esc(s.full_name||'—')+'</span>'+(s.license_number?'<span class="id">Mat. '+esc(s.license_number)+'</span>':'')+'</span></div></td>'+
      '<td>'+roleSel+'</td><td>'+estado+'</td><td>'+btn+'</td></tr>';
  }).join('');
  p.innerHTML='<div class="phead-page"><div><div class="eyebrow">Centro Revigen</div><h1>Equipo</h1></div></div>'+
    '<div class="callout" style="margin-bottom:20px"><span class="demo" style="flex:none">Solo Admin</span><p>Aprobás nuevos usuarios, cambiás roles y podés activar o desactivar cuentas. El director médico no puede administrar usuarios.</p></div>'+
    '<div class="card"><div class="scroll"><table class="tbl"><thead><tr><th style="min-width:230px">Persona</th><th style="min-width:200px">Rol</th><th style="min-width:150px">Estado</th><th style="min-width:130px">Acción</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}
async function setRole(uid,role){ const {error}=await DB().from('staff').update({role}).eq('user_id',uid); if(error){toast(error.message);renderEquipo();return;} toast('Rol actualizado'); loadDirectory(); }
async function setActive(uid,val,keepApproved){
  const upd={is_active:val}; if(val && !keepApproved) upd.approved_at=new Date().toISOString();
  const {error}=await DB().from('staff').update(upd).eq('user_id',uid); if(error){toast(error.message);return;}
  toast(val?'Usuario activado':'Usuario desactivado'); renderEquipo(); loadDirectory();
}

/* ===================== ARCHIVADOS (dirección) ===================== */
async function renderArchivados(){
  const p=$('page'); p.innerHTML='<div class="loading">Cargando…</div>';
  if(!can.director()){ p.innerHTML='<div class="callout"><p>Solo la dirección puede ver los pacientes archivados.</p></div>'; return; }
  const {data,error}=await DB().from('patients').select('id,hc_number,full_name,doc_type,doc_id,deleted_at').not('deleted_at','is',null).order('deleted_at',{ascending:false});
  if(error){p.innerHTML='<div class="callout"><p>'+esc(error.message)+'</p></div>';return;}
  const rows=(data||[]).map(x=>'<tr><td>'+(x.hc_number!=null?x.hc_number:'—')+'</td>'+
    '<td><div class="who"><span class="av">'+esc(initials(x.full_name))+'</span><span class="nm">'+esc(x.full_name||'(sin nombre)')+'</span></div></td>'+
    '<td class="quiet">'+((x.doc_type||'Doc')+' '+esc(x.doc_id||''))+'</td><td class="quiet">'+fmt(x.deleted_at)+'</td>'+
    '<td><button class="btn primary sm" onclick="restorePatient(\''+x.id+'\')">Recuperar</button></td></tr>').join('');
  p.innerHTML='<div class="phead-page"><div><div class="eyebrow">Centro Revigen</div><h1>Pacientes archivados</h1></div></div>'+
    '<div class="callout" style="margin-bottom:20px"><span class="demo" style="flex:none">Solo dirección</span><p>Pacientes archivados. Podés recuperarlos cuando lo necesites; nada se borra de la base.</p></div>'+
    (rows?'<div class="card"><div class="scroll"><table class="tbl"><thead><tr><th>HC</th><th style="min-width:220px">Paciente</th><th>Documento</th><th>Archivado</th><th>Acción</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>':'<div class="empty"><p>No hay pacientes archivados.</p></div>');
}
async function archivePatient(){
  if(!can.director())return;
  if(!confirm('¿Archivar a '+(CUR.full_name||'este paciente')+'? Deja de aparecer en la lista, pero lo recuperás desde "Archivados".'))return;
  const {error}=await DB().from('patients').update({deleted_at:new Date().toISOString(),deleted_by:ME.user_id}).eq('id',CUR.id);
  if(error){toast(error.message);return;}
  toast('Paciente archivado'); CACHE=null; CUR=null; navigate('pacientes');
}
async function restorePatient(id){
  const {error}=await DB().from('patients').update({deleted_at:null,deleted_by:null}).eq('id',id);
  if(error){toast(error.message);return;}
  toast('Paciente recuperado'); CACHE=null; renderArchivados();
}

/* ===================== IMPRIMIR / PDF (HC completa) ===================== */
async function printPatient(){
  const [{data:notes},{data:vitc},{data:labs},{data:inds}]=await Promise.all([
    DB().from('notes').select('*').eq('patient_id',CUR.id).order('created_at',{ascending:true}),
    DB().from('vitc_administrations').select('*').eq('patient_id',CUR.id).order('administered_at',{ascending:true}),
    DB().from('labs').select('*').eq('patient_id',CUR.id).order('measured_at',{ascending:true}),
    DB().from('indications').select('*').eq('patient_id',CUR.id).eq('kind','vitamina_c').eq('active',true).order('created_at',{ascending:false})
  ]);
  const indA=(inds||[])[0]||null;
  const indLine=(FCALC.inds||[]).length?('<p style="margin:0 0 8px"><b>Infusiones vigentes:</b><br>'+FCALC.inds.map(i=>esc(indTitle(i))+': '+esc(indSummary(i))).join('<br>')+'</p>'):'';
  const row=(l,v)=> (v||v===0)?'<tr><td class="k">'+esc(l)+'</td><td>'+esc(v)+'</td></tr>':'';
  const sec=(t,rows)=> rows?'<h3>'+t+'</h3><table>'+rows+'</table>':'';
  const a=anthro(CUR.weight_kg,CUR.height_cm); const anth=a?('IMC '+a.imc.toFixed(1)+' kg/m² · BSA '+a.bsa.toFixed(2)+' m²'):'';
  const labsHtml=(labs||[]).map(x=>{const p=[];
    if(x.hemoglobina!=null)p.push('Hb '+x.hemoglobina);if(x.hematocrito!=null)p.push('Hto '+x.hematocrito);
    if(x.leucocitos!=null)p.push('GB '+x.leucocitos);if(x.plaquetas!=null)p.push('Plaq '+x.plaquetas);
    if(x.glucemia!=null)p.push('Gluc '+x.glucemia);if(x.creatinina!=null)p.push('Creat '+x.creatinina);if(x.urea!=null)p.push('Urea '+x.urea);
    return '<div class="pn"><b>'+fmtDT(x.measured_at)+'</b> — '+esc(p.join(' · ')||'—')+(x.otros?' · '+esc(x.otros):'')+(x.notes?'<br>'+esc(x.notes):'')+'</div>';
  }).join('')||'<p>Sin laboratorios.</p>';
  const notesHtml=(notes||[]).map(n=>{const au=DIR[n.author_id];
    return '<div class="pn"><b>'+fmtDT(n.created_at)+'</b> — '+esc(au?au.full_name:'Profesional')+' ('+(DISC_LABEL[n.discipline]||n.discipline)+')'+(n.is_confidential?' · CONFIDENCIAL':'')+((n.structured&&n.structured.label)?' · '+esc(n.structured.label):'')+'<br>'+esc(n.content)+(n.weight_kg!=null?'<br>Peso: '+esc(n.weight_kg)+' kg':'')+'</div>';}).join('')||'<p>Sin evoluciones.</p>';
  const vitcHtml=(vitc||[]).map(v=>'<div class="pn"><b>'+fmtDT(v.administered_at)+'</b> — '+esc(adminCompsTxt(v))+(v.dilution_ml?' / '+v.dilution_ml+' ml':'')+'. Pre: FC '+(v.hr_pre??'—')+' TA '+(v.bp_pre??'—')+' Gluc '+(v.glucose_pre??'—')+'; Post: FC '+(v.hr_post??'—')+' TA '+(v.bp_post??'—')+' Gluc '+(v.glucose_post??'—')+(v.adverse_events?'. Eventos: '+esc(v.adverse_events):'')+'</div>').join('')||'<p>Sin administraciones.</p>';
  const tnm=[CUR.tnm_t&&('T'+CUR.tnm_t),CUR.tnm_n&&('N'+CUR.tnm_n),CUR.tnm_m&&('M'+CUR.tnm_m)].filter(Boolean).join(' ');
  const html='<!doctype html><html lang="es"><head><meta charset="utf-8"><title>HC '+(CUR.hc_number||'')+' - '+esc(CUR.full_name||'')+'</title>'+
  '<style>body{font-family:Arial,Helvetica,sans-serif;color:#1f2a37;max-width:820px;margin:0 auto;padding:24px;font-size:13px;line-height:1.5}'+
  'h1{color:#232824;border-bottom:2px solid #7d8a68;padding-bottom:8px;margin:0 0 4px;font-size:20px}'+
  '.meta{color:#666;font-size:12px;margin-bottom:14px}'+
  'h3{background:#eef2e4;color:#3a4038;padding:6px 10px;border-radius:5px;margin:18px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.04em}'+
  'table{width:100%;border-collapse:collapse;margin-bottom:6px}td{padding:4px 8px;vertical-align:top;border-bottom:1px solid #eee}td.k{width:220px;color:#666;font-weight:bold}'+
  '.pn{border-left:3px solid #7d8a68;padding:6px 10px;margin-bottom:8px;background:#f7f8f1;white-space:pre-wrap}@media print{.noprint{display:none}}</style></head><body>'+
  '<h1>REVIGEN — Historia Clínica</h1>'+
  '<div class="meta">HC N° '+(CUR.hc_number||'—')+' · Emitido '+fmtDT(new Date().toISOString())+' · por '+esc(ME.full_name)+' ('+ROLE_LABEL[ME.role]+')</div>'+
  sec('Datos filiatorios', row('Nombre y apellido',CUR.full_name)+row('Documento',((CUR.doc_type||'')+' '+(CUR.doc_id||'')).trim())+row('Sexo',CUR.sex)+
    row('Nacimiento',CUR.birth_date?fmt(CUR.birth_date)+' ('+edad(CUR.birth_date)+')':'')+row('Nacionalidad',CUR.nationality)+row('Estado civil',CUR.marital_status)+row('Ocupación',CUR.occupation)+
    row('Teléfono',CUR.phone)+row('Email',CUR.email)+row('Domicilio',CUR.address)+row('Localidad',CUR.city)+row('Provincia',CUR.province)+
    row('Obra social',CUR.coverage)+row('Plan',CUR.coverage_plan)+row('N° afiliado',CUR.affiliate_number)+row('Derivado por',CUR.referred_by)+
    row('Contacto emergencia',[CUR.emergency_contact_name,CUR.emergency_contact_relation,CUR.emergency_contact_phone].filter(Boolean).join(' · ')))+
  sec('Antecedentes y hábitos', row('Antecedentes personales',CUR.personal_history)+row('Antecedentes familiares',CUR.family_history)+row('Hábitos tóxicos',CUR.toxic_habits)+row('Medicación habitual',CUR.usual_medication)+row('Alergias',CUR.allergies))+
  sec('Estado funcional y antropometría', row('ECOG',CUR.ecog?(ECOG_TXT[CUR.ecog]||CUR.ecog):'')+row('Karnofsky',CUR.karnofsky!=null?CUR.karnofsky+'%':'')+row('Peso',CUR.weight_kg?CUR.weight_kg+' kg':'')+row('Talla',CUR.height_cm?CUR.height_cm+' cm':'')+row('IMC / BSA',anth))+
  sec('Diagnóstico y enfermedad actual', row('Diagnóstico',CUR.base_diagnosis)+row('CIE-10',CUR.cie10_code)+row('Fecha de diagnóstico',CUR.diagnosis_date?fmt(CUR.diagnosis_date):'')+row('Oncólogo tratante',CUR.treating_oncologist)+row('Estadificación',CUR.stage)+row('TNM',tnm)+row('Enfermedad actual',CUR.current_illness)+row('Biopsia y protocolo',CUR.biopsy_protocol)+row('Histología',CUR.histology))+
  sec('Examen físico y problemas', row('Examen físico',CUR.physical_exam)+row('Lista de problemas',CUR.problem_list))+
  sec('Tratamiento y plan', row('Tratamiento',CUR.treatment)+row('Plan',CUR.care_plan)+row('Evaluación de respuesta',CUR.treatment_response)+row('Fecha de evaluación',CUR.response_date?fmt(CUR.response_date):''))+
  sec('Comentarios', row('Comentarios',CUR.comentarios))+
  sec('Seguridad', row('G6PD',G6PD_LABEL[CUR.g6pd_status||'no_evaluado']))+
  '<h3>Laboratorio</h3>'+labsHtml+'<h3>Evoluciones</h3>'+notesHtml+'<h3>Infusiones</h3>'+indLine+vitcHtml+
  '<p class="noprint" style="text-align:center;margin-top:22px"><button onclick="window.print()">Imprimir / Guardar como PDF</button></p>'+
  '<scr'+'ipt>window.onload=function(){setTimeout(function(){window.print();},400);};</scr'+'ipt></body></html>';
  const w=window.open('','_blank'); if(!w){toast('Permití las ventanas emergentes para imprimir');return;}
  w.document.write(html); w.document.close();
}


/* ===================== INIT ===================== */
(function init(){
  const q=$('q');
  if(q){
    q.addEventListener('input',()=>{ if(curView!=='pacientes'){ navigate('pacientes'); } else { applyList(); } });
    q.addEventListener('keydown',e=>{ if(e.key==='Enter'&&curView!=='pacientes') navigate('pacientes'); });
  }
  const modalBg=$('modal'); if(modalBg) modalBg.addEventListener('click',e=>{ if(e.target===modalBg) modalClose(); });
  setAuthMode('login');
  // PWA: registra el service worker (si falla, la app funciona igual)
  if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ try{ navigator.serviceWorker.register('/sw.js').catch(e=>console.warn('SW no registrado',e)); }catch(e){} }); }
  SB.auth.getSession().then(({data})=>{ if(data && data.session) loadMe(); else { $('booting').hidden=true; renderAuth('login'); } })
    .catch(()=>{ $('booting').hidden=true; renderAuth('login'); });
})();

</script>
