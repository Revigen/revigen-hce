<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>REVIGEN · Historia Clínica</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#F4F6F1">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Revigen">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>

:root{
  --void:#0F120F;--panel:#171B17;--panel-2:#1E231E;--raise:#232824;
  --line:#272E28;--div:#232A24;
  --ink:#F6F6EC;--ink-2:#CBD0C2;--muted:#929A8D;--faint:#828B80;
  --vital:#DEF2C4;--sage:#9BA989;--alert:#E0A458;--crit:#D4705E;
  --r:14px;--rail:244px;
  --f-sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--void);color:var(--ink);font-family:var(--f-sans);
  font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
table{border-collapse:collapse;width:100%}
svg{stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--vital);outline-offset:2px;border-radius:5px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.eyebrow{font-family:var(--f-ui);font-size:11px;font-weight:600;letter-spacing:.11em;
  text-transform:uppercase;color:var(--faint)}
.label{font-family:var(--f-ui);font-size:12.5px;color:var(--muted)}
.meta{font-family:var(--f-ui);font-size:12.5px;color:var(--faint)}
.quiet{color:var(--muted)}
.note{font-family:"Times New Roman",Times,serif;font-style:italic;font-size:16px;color:var(--ink-2);line-height:1.6}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sec{padding:20px}
.sheet .sec + .sec{border-top:1px solid var(--div)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-bottom:16px}
.sec-t{font-size:15px;font-weight:500;color:var(--ink);letter-spacing:-.005em}

.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:18px;padding:8px 0;font-size:14px}
.row + .row{border-top:1px solid var(--div)}
.row .k{font-family:var(--f-ui);font-size:13px;color:var(--muted);flex:none}
.row .v{text-align:right;color:var(--ink)}

.st{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.st .d{width:7px;height:7px;border-radius:50%;background:var(--sage);flex:none}
.st.ok .d{background:var(--vital)}
.st.warn .d{background:var(--alert)}
.st.crit .d{background:var(--crit)}
.st.off .d{background:var(--faint)}
.st.warn{color:var(--alert)}
.st.crit{color:var(--crit)}

.tag{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:999px;
  border:1px solid var(--line);font-family:var(--f-ui);font-size:12.5px;color:var(--ink-2)}
.tag .d{width:7px;height:7px;border-radius:50%;background:var(--sage)}
.tag.ok{border-color:rgba(222,242,196,.32);background:rgba(222,242,196,.07)}
.tag.ok .d{background:var(--vital)}
.tag.crit{border-color:rgba(212,112,94,.42);background:rgba(212,112,94,.08);color:var(--crit)}
.tag.crit .d{background:var(--crit)}
.tag.warn{border-color:rgba(224,164,88,.4);background:rgba(224,164,88,.07);color:var(--alert)}
.tag.warn .d{background:var(--alert)}

.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:9px;
  border:1px solid var(--line);color:var(--ink-2);font-size:14px;transition:.15s}
.btn:hover{border-color:var(--sage);color:var(--ink);background:var(--panel-2)}
.btn svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.primary{background:var(--vital);color:#1A1F1A;border-color:var(--vital);font-weight:600}
.btn.primary:hover{background:#E9F7D8;color:#141814}
.demo{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-ui);font-size:12px;
  color:var(--alert);border:1px solid rgba(224,164,88,.35);border-radius:999px;padding:3px 11px}

.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100vh}
.rail{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;
  padding:24px 16px 16px;position:sticky;top:0;height:100vh}
.rail .lockup{width:190px;max-width:100%;display:block;margin:2px 0 32px 6px}
.rail .grp{font-family:var(--f-ui);font-size:12px;color:var(--faint);margin:0 0 8px 12px}
.rail .grp + nav{margin-bottom:26px}
.rail nav{display:flex;flex-direction:column;gap:3px}
.rail nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;
  color:var(--muted);font-size:14.5px;text-align:left;transition:.15s}
.rail nav button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5}
.rail nav button:hover{color:var(--ink-2);background:var(--panel-2)}
.rail nav button.on{color:var(--ink);background:var(--raise)}
.rail nav button.on svg{stroke:var(--vital)}
.rail nav button .bdg{margin-left:auto;font-family:var(--f-ui);font-size:12px;color:var(--faint)}
.rail nav button.on .bdg{color:var(--vital)}
.rail .me{margin-top:auto;display:flex;align-items:center;gap:11px;padding:14px 8px 4px;border-top:1px solid var(--div)}
.av{width:32px;height:32px;border-radius:9px;background:var(--raise);border:1px solid var(--line);
  display:grid;place-items:center;font-family:var(--f-ui);font-size:12px;font-weight:600;color:var(--sage);flex:none}
.av.lg{width:56px;height:56px;border-radius:14px;font-size:18px;color:var(--vital);font-family:var(--f-sans);font-weight:400}
.av.sm{width:26px;height:26px;border-radius:7px;font-size:10.5px}

.top{display:flex;align-items:center;gap:16px;padding:0 28px;height:64px;border-bottom:1px solid var(--line);
  background:var(--panel);position:sticky;top:0;z-index:30}
.find{flex:1;max-width:460px;display:flex;align-items:center;gap:10px;padding:9px 13px;
  border:1px solid var(--line);border-radius:10px;background:var(--void);color:var(--muted);font-size:14px}
.find svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;flex:none}
.find .k{margin-left:auto;font-family:var(--f-ui);font-size:11.5px;border:1px solid var(--line);
  border-radius:5px;padding:1px 6px;color:var(--faint)}
.top .right{margin-left:auto;display:flex;align-items:center;gap:14px}
.dot-live{width:8px;height:8px;border-radius:50%;background:var(--vital);
  box-shadow:0 0 0 0 rgba(222,242,196,.5);animation:pl 2.6s infinite}
@keyframes pl{70%{box-shadow:0 0 0 8px rgba(222,242,196,0)}100%{box-shadow:0 0 0 0 rgba(222,242,196,0)}}
.page{padding:28px 28px 88px;max-width:1680px}

.phead-page{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:24px}
.phead-page h1{margin:6px 0 0;font-size:26px;font-weight:400;letter-spacing:-.02em}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:22px}
.kpis > div{padding:20px 22px;position:relative}
.kpis > div + div{border-left:1px solid var(--div)}
.kpis .n{font-size:36px;font-weight:400;letter-spacing:-.025em;line-height:1.1;margin:8px 0 6px}
.kpis .sub{font-family:var(--f-ui);font-size:12.5px;color:var(--muted);line-height:1.5}
.kpis .spark{position:absolute;right:20px;bottom:20px;opacity:.9}

.legend{display:flex;align-items:center;gap:18px;flex-wrap:wrap;font-family:var(--f-ui);font-size:12.5px;color:var(--muted)}
.legend b{font-weight:500;color:var(--ink-2)}
.dots{display:inline-flex;gap:4px;vertical-align:middle}
.dots i{width:22px;height:5px;border-radius:3px;background:var(--div);display:block}
.dots i.a{background:var(--vital)}
.dots i.p{background:var(--alert);opacity:.6}

.tbl{font-size:14px}
.tbl.wide{min-width:1060px}
.tbl th{white-space:nowrap;font-family:var(--f-ui);font-size:11px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint);text-align:left;padding:0 16px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:15px 16px;border-bottom:1px solid var(--div);vertical-align:middle;color:var(--ink-2)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background .12s}
.tbl tbody tr:hover{background:var(--panel-2)}
.tbl tbody tr:hover td:first-child{box-shadow:inset 3px 0 0 var(--vital)}
.tbl.tight td{padding:12px 16px}
.who{display:flex;align-items:center;gap:12px}
.who .nm{color:var(--ink);display:block}
.who .id{font-family:var(--f-ui);font-size:12px;color:var(--faint);display:block;margin-top:1px;white-space:nowrap}
.scroll{overflow-x:auto}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{padding:6px 13px;border-radius:999px;border:1px solid transparent;font-size:13.5px;color:var(--muted)}
.filters button:hover{color:var(--ink-2);background:var(--panel-2)}
.filters button.on{color:var(--ink);border-color:var(--line);background:var(--panel-2)}

/* ---------- inicio ---------- */
.home{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;align-items:start}
.todo{display:flex;flex-direction:column}
.todo .it{display:flex;align-items:flex-start;gap:13px;padding:14px 0}
.todo .it + .it{border-top:1px solid var(--div)}
.todo .it .d{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--sage)}
.todo .it.crit .d{background:var(--crit)}
.todo .it.warn .d{background:var(--alert)}
.todo .it .b{flex:1;min-width:0}
.todo .it .t{font-size:14.5px;color:var(--ink)}
.todo .it .s{font-family:var(--f-ui);font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.55}
.todo .it .a{flex:none}
.day{display:flex;flex-direction:column}
.day .sl{display:grid;grid-template-columns:70px 1fr auto;gap:16px;align-items:center;padding:13px 0}
.day .sl + .sl{border-top:1px solid var(--div)}
.day .hh{font-size:15px;color:var(--ink)}
.day .nm{font-size:14.5px;color:var(--ink)}
.day .ds{font-family:var(--f-ui);font-size:12.5px;color:var(--muted);margin-top:2px}
.day .sl.now{background:rgba(222,242,196,.05);margin:0 -12px;padding:13px 12px;border-radius:9px}
.day .sl.now .hh{color:var(--vital)}

/* ---------- ficha ---------- */
.crumb{display:flex;align-items:center;gap:9px;font-family:var(--f-ui);font-size:12.5px;color:var(--faint);margin-bottom:16px}
.crumb button{color:var(--muted)}
.crumb button:hover{color:var(--ink-2);text-decoration:underline}
.pcard{display:flex;align-items:flex-start;gap:20px;flex-wrap:wrap;padding:22px 24px;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r) var(--r) 0 0}
.pcard h1{margin:0;font-size:24px;font-weight:400;letter-spacing:-.02em}
.pcard .line{font-family:var(--f-ui);font-size:13px;color:var(--muted);margin-top:6px;display:flex;gap:16px;flex-wrap:wrap}
.pcard .line b{color:var(--ink-2);font-weight:500}
.pcard .acts{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 14px;background:var(--panel);
  border:1px solid var(--line);border-top:0;position:sticky;top:64px;z-index:20}
.tabs button{padding:13px 14px;font-size:14px;color:var(--muted);white-space:nowrap;
  border-bottom:2px solid transparent;transition:.15s}
.tabs button:hover{color:var(--ink-2)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--vital)}
.fgrid{display:grid;grid-template-columns:312px minmax(0,1fr) 324px;gap:20px;margin-top:20px;align-items:start}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}

.crit-list{display:flex;flex-direction:column}
.crit-list .it{display:flex;align-items:flex-start;gap:11px;padding:11px 0}
.crit-list .it + .it{border-top:1px solid var(--div)}
.crit-list .it .d{width:7px;height:7px;border-radius:50%;margin-top:7px;flex:none;background:var(--sage)}
.crit-list .it.ok .d{background:var(--vital)}
.crit-list .it.warn .d{background:var(--alert)}
.crit-list .it.crit .d{background:var(--crit)}
.crit-list .it .k{font-family:var(--f-ui);font-size:12.5px;color:var(--muted)}
.crit-list .it .v{font-size:14px;color:var(--ink);margin-top:2px}
.crit-list .it.crit{background:rgba(212,112,94,.07);margin:0 -12px;padding:11px 12px;border-radius:9px}
.crit-list .it.crit + .it{border-top:0}

.plan{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.plan .c{padding:20px}
.plan .c:nth-child(odd){border-right:1px solid var(--div)}
.plan .c:nth-child(n+3){border-top:1px solid var(--div)}
.plan .c .hd{display:flex;align-items:center;gap:11px;flex-wrap:wrap;row-gap:7px}
.plan .c .hd svg{width:18px;height:18px;stroke:var(--vital);fill:none;stroke-width:1.5;flex:none}
.plan .c.off .hd svg{stroke:var(--faint)}
.plan .c .nm{font-size:14.5px;color:var(--ink);flex:1 1 130px;min-width:0}
.plan .c .v{font-size:18px;margin-top:14px;letter-spacing:-.01em}
.plan .c .s{font-family:var(--f-ui);font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.55}

.tl{display:flex;flex-direction:column}
.tl .it{display:grid;grid-template-columns:16px 1fr;gap:14px;padding-bottom:20px;position:relative}
.tl .it:last-child{padding-bottom:0}
.tl .it::before{content:"";position:absolute;left:7px;top:16px;bottom:0;width:1px;background:var(--div)}
.tl .it:last-child::before{display:none}
.tl .mk{width:15px;height:15px;border-radius:50%;border:1px solid var(--line);background:var(--panel);margin-top:3px;z-index:1}
.tl .it.now .mk{border-color:var(--vital);background:rgba(222,242,196,.2);box-shadow:0 0 0 4px rgba(222,242,196,.08)}
.tl .w{font-family:var(--f-ui);font-size:12px;color:var(--faint);letter-spacing:.04em}
.tl .t{font-size:14.5px;color:var(--ink);margin-top:2px}
.tl .s{font-family:var(--f-ui);font-size:12.5px;color:var(--muted);margin-top:2px}

.people{display:flex;flex-direction:column;gap:14px}
.people .p{display:flex;align-items:center;gap:12px}
.people .p .n{font-size:14px;color:var(--ink)}
.people .p .r{font-family:var(--f-ui);font-size:12.5px;color:var(--faint)}
.files{display:flex;flex-direction:column}
.files a{display:flex;align-items:center;gap:12px;padding:11px 0;text-decoration:none;font-size:14px}
.files a + a{border-top:1px solid var(--div)}
.files a:hover .fn{color:var(--vital)}
.files svg{width:16px;height:16px;stroke:var(--faint);fill:none;stroke-width:1.5;flex:none}
.files .fn{color:var(--ink-2);flex:1;transition:.15s}
.files .fd{font-family:var(--f-ui);font-size:12px;color:var(--faint)}
.log{display:flex;flex-direction:column;gap:11px;font-family:var(--f-ui);font-size:12.5px;color:var(--muted);line-height:1.5}
.log b{color:var(--ink-2);font-weight:500}

.ring-row{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.ring{width:112px;height:112px;flex:none}
.ring .lbl{font-size:26px;fill:var(--ink);font-family:var(--f-sans)}
.ring .sub{font-size:8px;fill:var(--muted);font-family:var(--f-ui);letter-spacing:.14em}
.stats{flex:1;min-width:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.stats .k{font-family:var(--f-ui);font-size:12.5px;color:var(--muted)}
.stats .v{font-size:17px;margin-top:5px}
.stats .s{font-family:var(--f-ui);font-size:12.5px;color:var(--faint);margin-top:3px}

/* formulario de la historia clínica */
.formnav{display:flex;gap:7px;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid var(--div)}
.formnav a{font-family:var(--f-ui);font-size:12.5px;color:var(--muted);text-decoration:none;
  padding:5px 11px;border-radius:999px;border:1px solid transparent;transition:.15s}
.formnav a:hover{color:var(--ink);border-color:var(--line);background:var(--panel-2)}
.ff{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.ff .wide{grid-column:1/-1}
.f label{display:block;font-family:var(--f-ui);font-size:12px;color:var(--muted);margin-bottom:6px}
.f input,.f textarea,.f select{width:100%;background:var(--void);border:1px solid var(--line);border-radius:9px;
  padding:10px 12px;color:var(--ink);font:inherit;font-size:14px}
.f textarea{min-height:74px;resize:vertical;line-height:1.55}
.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--sage);outline:none}
.f .calc{font-family:var(--f-ui);font-size:12.5px;color:var(--vital);margin-top:7px}
.savebar{display:flex;align-items:center;gap:10px;padding:14px 20px;border-top:1px solid var(--div);
  font-family:var(--f-ui);font-size:12.5px;color:var(--faint)}

/* listas de registros */
.subpills{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:4px}
.subpills button{padding:6px 13px;border-radius:999px;border:1px solid transparent;font-size:13.5px;color:var(--muted)}
.subpills button:hover{color:var(--ink-2);background:var(--panel-2)}
.subpills button.on{color:var(--ink);border-color:var(--line);background:var(--panel-2)}
.entry{padding:18px 20px}
.entry + .entry{border-top:1px solid var(--div)}
.entry .eh{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-bottom:10px}
.entry .eh .au{font-size:14px;color:var(--ink)}
.entry .bd{color:var(--ink-2);font-size:14.5px;line-height:1.7;max-width:72ch;margin:0}
.entry .ft{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.gate{display:flex;gap:13px;align-items:flex-start;padding:16px 18px;border-radius:11px;
  border:1px solid rgba(224,164,88,.32);background:rgba(224,164,88,.07)}
.gate.ok{border-color:rgba(222,242,196,.28);background:rgba(222,242,196,.05)}
.gate p{margin:0;font-family:var(--f-ui);font-size:13px;line-height:1.6;color:var(--ink-2);max-width:76ch}
.gate .ic{width:8px;height:8px;border-radius:50%;background:var(--alert);margin-top:7px;flex:none}
.gate.ok .ic{background:var(--vital)}

.empty{display:flex;flex-direction:column;align-items:center;gap:18px;padding:64px 24px;text-align:center;
  color:var(--muted);font-size:14.5px;line-height:1.65}
.empty img{width:36px}
.empty p{margin:0;max-width:48ch}
.empty b{color:var(--ink);font-weight:500}
.callout{display:flex;gap:14px;align-items:flex-start;padding:18px 20px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--panel-2)}
.callout p{margin:0;font-family:var(--f-ui);font-size:13px;color:var(--muted);line-height:1.65;max-width:78ch}

/* ---------- acceso ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr}
.login .l{position:relative;padding:60px;display:flex;flex-direction:column;justify-content:space-between;
  overflow:hidden;border-right:1px solid var(--line)}
.login .glow{position:absolute;inset:auto -15% -50% -10%;height:600px;
  background:radial-gradient(closest-side,rgba(155,169,137,.15),transparent 72%);pointer-events:none}
.login .ringbg{position:absolute;right:-140px;top:50%;transform:translateY(-50%);width:660px;opacity:.55;pointer-events:none}
.login .lockup{width:350px;max-width:80%;position:relative}
.login h2{font-size:31px;font-weight:400;letter-spacing:-.02em;line-height:1.3;max-width:15ch;margin:0;
  position:relative;text-wrap:balance}
.login .legal{font-family:var(--f-ui);font-size:12.5px;color:var(--faint);max-width:48ch;position:relative;line-height:1.7}
.login .r{padding:60px 56px;display:flex;flex-direction:column;justify-content:center;background:var(--panel)}
.form{width:100%;max-width:340px}
.field{margin-bottom:16px}
.field label{display:block;font-family:var(--f-ui);font-size:12.5px;color:var(--muted);margin-bottom:7px}
.field .inp{border:1px solid var(--line);background:var(--void);border-radius:10px;padding:12px 14px;
  color:var(--ink-2);font-size:14.5px}
.field .inp.ph{color:var(--faint)}
.codes{display:flex;gap:8px}
.codes span{flex:1;aspect-ratio:1/1.2;border:1px solid var(--line);border-radius:9px;background:var(--void);
  display:grid;place-items:center;font-size:19px;color:var(--ink)}
.codes span.e{color:var(--faint)}

/* ---------- sistema ---------- */
.doc{max-width:980px;margin:0 auto;padding:52px 24px 100px}
.doc h1{font-size:30px;font-weight:400;letter-spacing:-.02em;margin:8px 0 14px}
.doc p.intro{max-width:64ch;color:var(--ink-2);margin:0 0 40px;line-height:1.75;font-size:15px}
.doc h2{font-size:16px;font-weight:500;margin:0 0 16px}
.doc section{margin-bottom:42px}
.sw{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:14px}
.sw .s{border:1px solid var(--line);border-radius:11px;overflow:hidden}
.sw .s .c{height:74px}
.sw .s .m{padding:12px 14px;background:var(--panel)}
.sw .s .m b{display:block;font-weight:500;font-size:14px;margin-bottom:3px}
.sw .s .m span{font-family:var(--f-ui);font-size:12.5px;color:var(--muted)}
.spec{display:flex;gap:20px;align-items:baseline;padding:14px 0}
.spec + .spec{border-top:1px solid var(--div)}
.spec .k{width:150px;flex:none;font-family:var(--f-ui);font-size:13px;color:var(--muted)}
.spec .v{flex:1;color:var(--ink-2);line-height:1.6}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:var(--vital);
  background:rgba(222,242,196,.07);padding:1px 6px;border-radius:5px}

.mock{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:90;display:flex;align-items:center;
  gap:5px;padding:6px;border-radius:999px;background:rgba(15,18,15,.93);border:1px solid var(--line);
  backdrop-filter:blur(12px);box-shadow:0 10px 34px rgba(0,0,0,.5)}
.mock .t{font-family:var(--f-ui);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);
  padding:0 11px 0 13px}
.mock button{padding:7px 14px;border-radius:999px;font-size:13.5px;color:var(--muted)}
.mock button:hover{color:var(--ink)}
.mock button.on{background:var(--raise);color:var(--vital)}

@media (max-width:1240px){
  .fgrid{grid-template-columns:minmax(0,1fr) 320px}
  .fgrid .side-a{grid-column:1/-1}
  .fgrid .side-a .sheet{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .fgrid .side-a .sec + .sec{border-top:0}
  .fgrid .side-a .sec:nth-child(odd){border-right:1px solid var(--div)}
  .fgrid .side-a .sec:nth-child(n+3){border-top:1px solid var(--div)}
  .home{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:1040px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;align-items:center;gap:14px;border-right:0;
    border-bottom:1px solid var(--line);padding:14px 16px;overflow-x:auto}
  .rail .lockup{width:148px;margin:0 12px 0 0}
  .rail nav{flex-direction:row;margin-bottom:0!important}
  .rail nav button span.t{display:none}
  .rail .grp,.rail .me{display:none}
  .tabs{top:0}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis > div:nth-child(3),.kpis > div:nth-child(4){border-top:1px solid var(--div)}
  .kpis > div:nth-child(3){border-left:0}
  .fgrid,.plan,.two,.stats,.ff{grid-template-columns:minmax(0,1fr)}
  .fgrid .side-a .sheet{grid-template-columns:minmax(0,1fr)}
  .fgrid .side-a .sec:nth-child(odd){border-right:0}
  .fgrid .side-a .sec + .sec{border-top:1px solid var(--div)}
  .login{grid-template-columns:1fr}
  .login .l{padding:44px 20px;border-right:0;border-bottom:1px solid var(--line)}
  .login .r{padding:36px 20px}
  .login .ringbg{display:none}
  .page,.top{padding-left:16px;padding-right:16px}
}
@media (max-width:600px){
  .kpis{grid-template-columns:minmax(0,1fr)}
  .kpis > div + div{border-left:0;border-top:1px solid var(--div)}
  .pcard .acts{margin-left:0;width:100%}
  .day .sl{grid-template-columns:64px 1fr}
  .mock .t{display:none}
}


/* ===== añadidos de la app (fuera de la maqueta) ===== */
.hidden{display:none!important}
.loading{padding:52px 24px;text-align:center;color:var(--muted);font-family:var(--f-ui);font-size:14px}
.err{color:var(--crit);font-family:var(--f-ui);font-size:13px;margin-top:10px;min-height:1em}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--raise);color:var(--ink);
  padding:11px 18px;border-radius:10px;font-size:14px;border:1px solid var(--line);font-family:var(--f-ui);
  box-shadow:0 10px 30px rgba(0,0,0,.55);opacity:0;transition:opacity .25s;z-index:120;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;place-items:center;z-index:100;padding:16px}
.modal-bg.show{display:grid}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:100%;max-width:580px;max-height:92vh;overflow:auto}
.modal h3{margin:0;padding:18px 20px;font-size:16px;font-weight:500;border-bottom:1px solid var(--div)}
.modal .mb{padding:18px 20px;display:grid;gap:14px}
.modal .mf{padding:14px 20px;border-top:1px solid var(--div);display:flex;justify-content:flex-end;gap:10px;position:sticky;bottom:0;background:var(--panel)}
.modal .field{margin:0}
.modal label{display:block;font-family:var(--f-ui);font-size:12px;color:var(--muted);margin-bottom:6px}
.modal input,.modal select,.modal textarea{width:100%;background:var(--void);border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--ink);font:inherit;font-size:14px}
.modal textarea{min-height:92px;resize:vertical;line-height:1.55}
.modal input:focus,.modal select:focus,.modal textarea:focus{border-color:var(--sage);outline:none}
.modal code{user-select:all;word-break:break-all}
.grid{display:grid;gap:12px}
.grid.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid .full{grid-column:1/-1}
@media(max-width:600px){.grid.g2,.grid.g3{grid-template-columns:1fr}}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.btn.dg{border-color:rgba(212,112,94,.4);color:var(--crit)}
.btn.dg:hover{border-color:var(--crit);background:rgba(212,112,94,.08);color:var(--crit)}
.g6pd{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:999px;font-family:var(--f-ui);font-size:12.5px;border:1px solid var(--line);color:var(--ink-2)}
.g6pd.normal{border-color:rgba(222,242,196,.32);background:rgba(222,242,196,.07);color:var(--vital)}
.g6pd.deficiente,.g6pd.no_evaluado{border-color:rgba(224,164,88,.4);background:rgba(224,164,88,.07);color:var(--alert)}
.rail .me{gap:11px}
.rail .me .minfo{min-width:0;flex:1}
.rail .me .mn{font-size:13.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail .me .mr{font-family:var(--f-ui);font-size:11.5px;color:var(--faint)}
.rail .me .macts{display:flex;gap:10px;margin-top:3px}
.linkbtn{background:none;border:0;color:var(--faint);font-family:var(--f-ui);font-size:12px;cursor:pointer;padding:0}
.linkbtn:hover{color:var(--ink-2);text-decoration:underline}
.top .right .linkbtn{font-size:12.5px}
.chart-controls{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
.chart-controls button{padding:5px 11px;border-radius:999px;border:1px solid transparent;font-size:12.5px;color:var(--muted);font-family:var(--f-ui)}
.chart-controls button:hover{color:var(--ink-2);background:var(--panel-2)}
.chart-controls button.on{color:var(--ink);border-color:var(--line);background:var(--panel-2)}
.form input,.form select{width:100%;background:var(--void);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--ink);font:inherit;font-size:14.5px}
.form input:focus,.form select:focus{border-color:var(--sage);outline:none}
.form .authtabs{display:flex;gap:6px;margin-bottom:20px}
.form .authtabs button{flex:1;padding:9px;border-radius:9px;border:1px solid var(--line);color:var(--muted);font-size:14px}
.form .authtabs button.on{background:var(--raise);color:var(--ink);border-color:var(--raise)}
.find input{flex:1;min-width:0;background:none;border:0;color:var(--ink);font:inherit;font-size:14px;outline:none}
.find input::placeholder{color:var(--muted)}
.subnav-wrap{overflow-x:auto}
.savebar .ok{color:var(--vital)}
.tag.disc{text-transform:none}
/* barra superior en pantallas chicas: se apila para no desbordar */
@media (max-width:680px){
  .top{flex-wrap:wrap;height:auto;min-height:0;padding:10px 14px;gap:10px 12px}
  .top .find{order:2;flex:1 1 100%;max-width:none}
  .top .right{order:1;margin-left:auto;gap:12px}
  #topDate{display:none}
}
/* barra de navegación inferior estilo app de iPhone (solo móvil/tablet) */
#bottomNav{display:none}
@media (max-width:1040px){
  html,body{max-width:100%;overflow-x:hidden}
  /* la barra lateral queda como franja superior solo con el logo */
  .rail{gap:10px;padding:12px 14px}
  .rail nav,.rail .grp,.rail .me{display:none!important}
  .rail .lockup{width:130px;margin:0}
  /* barra inferior fija */
  #bottomNav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;
    background:var(--panel);border-top:1px solid var(--line);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;gap:2px}
  #bottomNav button{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:6px 2px;color:var(--muted);font-family:var(--f-ui);font-size:11px;border-radius:10px}
  #bottomNav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.6}
  #bottomNav button.on{color:var(--vital)}
  #bottomNav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .page{padding-bottom:92px}
}

/* ====== TEMA CLARO CLÍNICO (Opción A) ====== */
:root{
  color-scheme:light;
  --void:#F4F6F1; --panel:#FFFFFF; --panel-2:#EEF1EA; --raise:#E7EDE2;
  --line:#E2E7DD; --div:#ECEFE8;
  --ink:#1B241F; --ink-2:#36423A; --muted:#566055; --faint:#667066;
  --vital:#3C6B3A; --sage:#5E7256; --alert:#B45309; --crit:#DC2626;
}
body{background:var(--void);color:var(--ink)}
.btn.primary{background:var(--vital);color:#fff;border-color:var(--vital)}
.btn.primary:hover{background:#335C31;color:#fff;border-color:#335C31}
.rail .lockup,.login .lockup{background:#232824;padding:9px 12px;border-radius:10px}
.login .l{background:var(--panel-2)} .login .r{background:var(--panel)}
.tag.ok{border-color:#BFE3C7;background:#E9F7ED;color:#15803D}.tag.ok .d{background:#15803D}
.tag.crit{border-color:#F3C9C2;background:#FDECEA;color:#B4231A}.tag.crit .d{background:#DC2626}
.tag.warn{border-color:#EBD6B6;background:#FBF1E1;color:#8A5212}.tag.warn .d{background:#D97706}
.st.ok .d{background:#15803D}.st.warn{color:#8A5212}.st.warn .d{background:#D97706}.st.crit{color:#B4231A}.st.crit .d{background:#DC2626}.st.off .d{background:#AEB6AA}
.gate{border-color:#EBD6B6;background:#FBF3E8}.gate .ic{background:#D97706}
.gate.ok{border-color:#BFE3C7;background:#EDF7EF}.gate.ok .ic{background:#15803D}
.callout{background:var(--panel-2);border-color:var(--line)}
.demo{color:#8A5212;border-color:#EBD6B6;background:#FBF1E1}
.dot-live{background:#3C6B3A;box-shadow:0 0 0 0 rgba(60,107,58,.4)}
@keyframes pl{70%{box-shadow:0 0 0 8px rgba(60,107,58,0)}100%{box-shadow:0 0 0 0 rgba(60,107,58,0)}}
.av{color:#4C5A48}.av.lg{color:var(--vital)}
.tbl tbody tr:hover{background:var(--panel-2)}
.tbl tbody tr:hover td:first-child{box-shadow:inset 3px 0 0 var(--vital)}
.filters button.on,.subpills button.on,.form .authtabs button.on{background:var(--raise);color:var(--ink);border-color:var(--line)}
.toast{background:#232824;color:#F6F6EC;border-color:#232824}
.crit-list .it.crit{background:#FDECEA}
/* ====== Compose del registro clínico ====== */
.compose{background:var(--panel);border:1.5px solid var(--vital);border-radius:14px;padding:15px 16px;box-shadow:0 2px 12px rgba(60,107,58,.08)}
.compose .ch{display:flex;align-items:center;gap:9px;margin-bottom:10px;flex-wrap:wrap}
.compose .ch b{font-size:14px;color:var(--ink)}
.compose textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-family:var(--f-ui);font-size:14.5px;color:var(--ink);resize:vertical;min-height:82px;background:var(--void);box-sizing:border-box;line-height:1.55}
.compose textarea:focus{outline:none;border-color:var(--vital)}
.compose .cf{display:flex;align-items:center;gap:10px;margin-top:11px;flex-wrap:wrap}
.compose .cf input{border:1px solid var(--line);background:var(--void);border-radius:9px;padding:8px 11px;font-size:13px;color:var(--ink);font-family:var(--f-ui);width:150px}
.compose .cf .hint{color:var(--faint);font-size:12px;flex:1;min-width:160px}
.compose .cf .btn{margin-left:auto}
.csel{border:1px solid var(--line);background:var(--void);border-radius:9px;padding:7px 11px;font-size:13px;color:var(--ink);font-family:var(--f-ui)}
/* ====== Historia clínica: datos de base plegables ====== */
details.base{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
details.base>summary{list-style:none;cursor:pointer;padding:15px 18px;display:flex;align-items:center;gap:11px;background:var(--panel-2)}
details.base>summary::-webkit-details-marker{display:none}
details.base .caret{width:16px;height:16px;stroke:var(--faint);fill:none;stroke-width:2;transition:transform .2s;flex:none}
details.base[open] .caret{transform:rotate(90deg)}
details.base summary b{font-size:14px;font-weight:600;color:var(--ink)}
details.base summary .sub{color:var(--faint);font-size:12.5px;font-family:var(--f-ui)}
details.base .body{padding:4px 0 0}
details.base .body .sheet{border:0;border-radius:0}
details.base .corrbar{display:flex;align-items:center;gap:10px;padding:12px 20px 4px;flex-wrap:wrap}
.entry .bd.pl{white-space:pre-line}
.entry .bd.pl b{font-weight:600;color:var(--ink)}
.compose .gquick{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:0 0 10px}
.compose .gquick .meta{margin-right:2px}
/* ====== Notas guiadas ====== */
body.gn-open{overflow:hidden}
.gn{position:fixed;inset:0;z-index:95;background:var(--void);overflow:auto;-webkit-overflow-scrolling:touch}
.gn-in{max-width:1080px;margin:0 auto;padding:22px 24px 60px}
.gn-top{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-bottom:4px}
.gn-pill{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:7px 13px;font-size:13.5px;color:var(--ink-2);font-weight:600;font-family:var(--f-ui)}
.gn-who{font-weight:600;font-size:14px;color:var(--ink)}
.gn-save{display:inline-flex;align-items:center;gap:7px;color:#15803D;background:#E9F7ED;border:1px solid #BFE3C7;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;margin-left:auto;font-family:var(--f-ui)}
.gn-save.warn{color:#8A5212;background:#FBF1E1;border-color:#EBD6B6}
.gn-save svg,.gn-foot svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;flex:none}
.gn-pt{color:var(--muted);font-size:13px;margin:6px 0 0;font-family:var(--f-ui)}
.gn-pt b{color:var(--ink);font-weight:600}
.gn-call{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);background:var(--panel-2);border-radius:12px;padding:11px 14px;color:var(--ink-2);margin:12px 0 18px;font-size:13px;line-height:1.55;font-family:var(--f-ui)}
.gn-call .ic{width:9px;height:9px;border-radius:50%;background:var(--vital);flex:none;margin-top:5px}
.gn-call.conf{border-color:#DDCBF5;background:#F7F2FE}.gn-call.conf .ic{background:#7C3AED}
.gn-cols{display:flex;gap:22px;align-items:flex-start}
.gn-idx{width:232px;flex:none;position:sticky;top:14px}
.gn-idx h4{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:0 0 8px 10px;font-weight:600;font-family:var(--f-ui)}
.gn-idx ul{list-style:none;margin:0;padding:0}
.gn-idx li{padding:8px 12px;border-radius:9px;font-size:13.5px;color:var(--muted);cursor:pointer;border-left:2px solid transparent;font-family:var(--f-ui)}
.gn-idx li:hover{background:var(--panel-2)}
.gn-idx li.cur{background:#F0F6EE;color:var(--ink);font-weight:600;border-left-color:var(--vital)}
.gn-form{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.gsec{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 17px;scroll-margin-top:14px}
.gsec:focus-within{border-color:var(--vital);box-shadow:0 2px 12px rgba(60,107,58,.08)}
.gsec .sh{display:flex;align-items:center;gap:9px;margin-bottom:8px;flex-wrap:wrap}
.gsec .lb{font-size:15px;font-weight:600;color:var(--ink)}
.gsec .opt{font-size:11px;color:var(--faint);font-family:var(--f-ui)}
.gsec .fromficha{font-size:11px;color:#15803D;background:#E9F7ED;border:1px solid #BFE3C7;border-radius:999px;padding:2px 8px;font-family:var(--f-ui)}
.gsec .tools{margin-left:auto;display:flex;gap:6px;align-items:center}
.gprev{font-size:11.5px;color:#1D4ED8;background:#EAF1FD;border:1px solid #C7DBF5;border-radius:999px;padding:4px 10px;display:inline-flex;gap:5px;align-items:center;font-family:var(--f-ui)}
.gprev svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2}
.gsec .hint{color:var(--faint);font-size:12.5px;margin:-2px 0 9px;font-family:var(--f-ui)}
.gf{margin-top:9px}.gf:first-of-type{margin-top:0}
.gf .fl{display:block;font-size:12px;color:var(--muted);margin:0 0 4px;font-family:var(--f-ui)}
.gff{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:var(--f-ui);font-size:14px;color:var(--ink);background:var(--void)}
textarea.gff{min-height:66px;resize:vertical;line-height:1.5;padding-right:46px;display:block}
.gff:focus{outline:none;border-color:var(--vital)}
.gta{position:relative}
.gmic{position:absolute;top:7px;right:7px;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center}
.gmic svg{width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:1.8}
.gmic.on{background:#FDECEA;border-color:#F3C9C2}.gmic.on svg{stroke:#DC2626}
.grow{display:grid;gap:10px;margin-top:9px}.grow:first-child{margin-top:0}
.grow .gf{margin-top:0}
.gchips{display:flex;gap:7px;flex-wrap:wrap}
.gch{border:1px solid var(--line);background:var(--void);border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--muted);font-family:var(--f-ui)}

.gn-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px;padding:10px 2px;color:var(--faint);font-size:12.5px;font-family:var(--f-ui)}

@media(max-width:760px){

/* selector de plantillas */
.tplmenu{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tplmenu button{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;text-align:left;width:100%;background:var(--panel)}
.tplmenu button + button{border-top:1px solid var(--div)}
.tplmenu button:hover{background:#F0F6EE}
.tplmenu .ic{width:34px;height:34px;border-radius:9px;background:var(--panel-2);display:grid;place-items:center;flex:none}
.tplmenu .ic svg{width:18px;height:18px;stroke:var(--vital);fill:none;stroke-width:1.6}
.tplmenu .nm{font-weight:600;font-size:14.5px;color:var(--ink)}
.tplmenu .ds{color:var(--muted);font-size:12.5px;margin-top:2px;font-family:var(--f-ui)}
.tplmenu .sug{font-size:11px;font-weight:600;color:#15803D;background:#E9F7ED;border:1px solid #BFE3C7;border-radius:999px;padding:1px 7px;margin-left:4px;vertical-align:1px}
.tplmore summary{cursor:pointer;font-family:var(--f-ui);font-size:13px;color:var(--muted);padding:4px 2px}

.cat-list{overflow:visible}

.fc-n{position:absolute;top:4px;left:4px;min-width:22px;height:22px;border-radius:11px;background:rgba(20,30,20,.72);color:#fff;font-family:var(--f-ui);font-size:12px;display:grid;place-items:center;padding:0 5px}

// Una fecha 'AAAA-MM-DD' (nacimiento, diagnóstico…) es local: new Date() la toma como medianoche UTC y en Argentina mostraba el día anterior.
function toDate(d){ if(typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)){ const [y,m,dd]=d.split('-').map(Number); return new Date(y,m-1,dd); } return new Date(d); }
function todayLocal(){ return nowLocalInput().slice(0,10); }
function fmt(d){if(!d)return '—';const x=toDate(d);if(isNaN(x))return d;return x.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'});}
function fmtDate(d){return fmt(d);}
function fmtDT(d){if(!d)return '';const x=new Date(d);if(isNaN(x))return '';return x.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+x.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});}
function fmtDMShort(d){if(!d)return '';const x=toDate(d);if(isNaN(x))return '';return x.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'});}
function fmtHM(d){if(!d)return '';const x=new Date(d);if(isNaN(x))return '';return x.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});}
function edad(d){if(!d)return '';const b=toDate(d);if(isNaN(b))return '';let a=new Date().getFullYear()-b.getFullYear();const m=new Date().getMonth()-b.getMonth();if(m<0||(m===0&&new Date().getDate()<b.getDate()))a--;return a>=0&&a<130?a+' años':'';}
function daysSince(d){if(!d)return Infinity;const x=toDate(d);if(isNaN(x))return Infinity;return (Date.now()-x.getTime())/86400000;}
function num(v){return v===''||v==null?null:Number(v);}
function initials(name){const p=(name||'').trim().split(/\s+/).filter(Boolean);if(!p.length)return '··';return ((p[0][0]||'')+(p.length>1?p[p.length-1][0]:'')).toUpperCase();}
function esES(n){return (n||0).toLocaleString('es-AR');}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600);}

/* ---------- pantallas ---------- */
function screen(s){ $('booting').hidden=true; ['s-acceso','s-app'].forEach(x=>$(x).hidden=(x!=='s-'+s)); }

/* ---------- modal ---------- */
let modalCb=null;
function modalOpen(title,body,okLabel,cb){
  $('mTitle').textContent=title;$('mBody').innerHTML=body;
  $('mFoot').innerHTML='<button class="btn" onclick="modalClose()">Cancelar</button><button class="btn primary" id="mOk">'+esc(okLabel)+'</button>';
  modalCb=cb;$('modal').classList.add('show');
  $('mOk').onclick=async()=>{$('mOk').disabled=true;let ok;try{ok=await cb();}catch(e){ok=false;toast(e.message||'Error');}$('mOk').disabled=false;if(ok!==false)modalClose();};
}
function modalClose(){$('modal').classList.remove('show');modalCb=null;}

/* ---------- barra lateral y superior ---------- */
function railBtn(view,label,badge){
  return '<button class="'+(curView===view?'on':'')+'" onclick="navigate(\''+view+'\')">'+IC[view]+
    '<span class="t">'+label+'</span>'+(badge?'<span class="bdg">'+badge+'</span>':'')+'</button>';
}
function buildRail(){
  const openRow = CUR ? '<div class="grp">Ficha abierta</div><nav><button class="'+(curView==='ficha'?'on':'')+'" onclick="navigate(\'ficha\')">'+IC.ficha+
      '<span class="t">'+esc(CUR.full_name||'Paciente')+'</span></button></nav>' : '';
  let gest='';
  if(can.manageUsers()||can.director()){
    gest='<div class="grp">Gestión</div><nav>'+
      (can.manageUsers()?railBtn('equipo','Equipo'):'')+
      (can.director()?railBtn('archivados','Archivados'):'')+
      (can.catalog()?railBtn('catalogo','Catálogo'):'')+'</nav>';
  }
  $('rail').innerHTML=
    '<img class="lockup" src="'+LOGO+'" alt="Revigen · Oncología Integrativa">'+
    '<div class="grp">Centro</div><nav>'+railBtn('inicio','Inicio')+railBtn('pacientes','Pacientes')+railBtn('agenda','Agenda')+'</nav>'+
    openRow+ gest+
    '<div class="me"><span class="av">'+esc(initials(ME.full_name))+'</span>'+
      '<div class="minfo"><div class="mn">'+esc(ME.full_name||ME.email||'')+'</div>'+
      '<div class="mr">'+esc(ROLE_LABEL[ME.role]||ME.role)+'</div>'+
      '<div class="macts"><button class="linkbtn" onclick="openAccount()">Mi cuenta</button><button class="linkbtn" onclick="doSignOut()">Salir</button></div>'+
      '</div></div>';
  buildBottomNav();
}
function bnavBtn(view,label){ return '<button class="'+(curView===view?'on':'')+'" onclick="navigate(\''+view+'\')">'+IC[view]+'<span>'+label+'</span></button>'; }
function buildBottomNav(){
  const el=$('bottomNav'); if(!el) return;
  let items=bnavBtn('inicio','Inicio')+bnavBtn('pacientes','Pacientes')+bnavBtn('agenda','Agenda');
  if(CUR) items+='<button class="'+(curView==='ficha'?'on':'')+'" onclick="navigate(\'ficha\')">'+IC.ficha+'<span>Ficha</span></button>';
  if(can.manageUsers()) items+=bnavBtn('equipo','Equipo');
  else if(can.director()) items+=bnavBtn('archivados','Archivados');
  el.innerHTML=items;
}
function updateTop(){
  const now=new Date();
  const d=now.toLocaleDateString('es-AR',{weekday:'long',day:'2-digit',month:'long'});
  $('topDate').textContent=d.charAt(0).toUpperCase()+d.slice(1)+' · '+fmtHM(now);
}

/* ---------- navegación ---------- */
function navigate(view){
  curView=view;
  if(view!=='ficha'){ const q=$('q'); if(q) q.placeholder='Buscar paciente, documento o N° de historia'; }
  buildRail();
  const p=$('page');
  if(view==='inicio') renderInicio();
  else if(view==='pacientes'){ CUR=null; buildRail(); renderPacientes(); }
  else if(view==='ficha'){ if(CUR) renderFicha(); else renderPacientes(); }
  else if(view==='agenda') renderAgenda();
  else if(view==='equipo'){ if(can.manageUsers()) renderEquipo(); else navigate('inicio'); }
  else if(view==='archivados'){ if(can.director()) renderArchivados(); else navigate('inicio'); }
  else if(view==='catalogo'){ if(can.catalog()) renderCatalogo(); else navigate('inicio'); }
  window.scrollTo(0,0);
}


/* ===================== ACCESO / AUTH ===================== */
function setAuthMode(m){ authMode=m; renderAuth(m); }

  screen('acceso');
  $('loginLogo').src=LOGO;
  const el=$('authForm');
  if(mode==='pending'){
    el.innerHTML='<div class="eyebrow" style="margin-bottom:8px">Cuenta pendiente</div>'+
      '<div style="font-size:21px;margin-bottom:14px">Esperando aprobación</div>'+
      '<p class="meta" style="line-height:1.7;margin:0 0 22px">Tu cuenta fue creada correctamente y está <b style="color:var(--ink-2)">pendiente de aprobación</b> por un administrador del centro. Cuando te activen vas a poder ingresar a las historias clínicas.</p>'+
      '<button class="btn" style="width:100%;justify-content:center" onclick="doSignOut()">Salir</button>';
    return;
  }
  const signup = mode==='signup';
  el.innerHTML=
    '<div class="eyebrow" style="margin-bottom:8px">Acceso profesional</div>'+
    '<div style="font-size:21px;margin-bottom:22px">'+(signup?'Crear mi cuenta':'Ingresá con tu cuenta')+'</div>'+
    '<div class="authtabs"><button class="'+(!signup?'on':'')+'" onclick="setAuthMode(\'login\')">Ingresar</button>'+
      '<button class="'+(signup?'on':'')+'" onclick="setAuthMode(\'signup\')">Registrarme</button></div>'+
    (signup?
      '<div class="field"><label>Nombre y apellido</label><input id="suName" placeholder="Ej: Dra. Ana Gómez"></div>'+
      '<div class="field"><label>Rol en el centro</label><select id="suRole">'+
        '<option value="oncologo">Médico oncólogo</option><option value="medico_funcional">Médico funcional</option><option value="director_medico">Director médico</option>'+
        '<option value="enfermeria">Enfermería</option><option value="nutricion">Nutrición</option>'+
        '<option value="psicooncologia">Psicooncología</option><option value="ejercicio">Actividad física</option></select></div>'+
      '<div class="field"><label>Matrícula (opcional)</label><input id="suLicense" placeholder="Ej: MP 12345"></div>'
      :'')+
    '<div class="field"><label>Correo institucional</label><input id="auEmail" type="email" autocomplete="username" placeholder="tu@revigen.com.ar"></div>'+
    '<div class="field"><label>Contraseña</label><input id="auPass" type="password" autocomplete="'+(signup?'new-password':'current-password')+'" placeholder="Mínimo 6 caracteres"></div>'+
    '<button class="btn primary" style="width:100%;justify-content:center;margin-top:6px" id="auBtn" onclick="doAuth()">'+(signup?'Crear mi cuenta':'Ingresar')+'</button>'+
    (!signup?'<div style="text-align:center;margin-top:12px"><button class="linkbtn" onclick="forgotPass()">¿Olvidaste tu contraseña?</button></div>':'')+
    '<div id="auErr" class="err"></div>'+
    (signup?'<p class="meta" style="line-height:1.7;margin:6px 2px 0">El primer registro queda como <b style="color:var(--ink-2)">Admin</b> y podrá autorizar al resto del equipo. Los demás quedan pendientes hasta que un Admin los active.</p>':
      '<div class="meta" style="margin-top:22px;padding-top:18px;border-top:1px solid var(--div);line-height:1.7">Las altas de usuario quedan pendientes hasta que un administrador las aprueba.</div>');
  const ep=$('auPass'); if(ep) ep.addEventListener('keydown',e=>{if(e.key==='Enter')doAuth();});
}
async function doAuth(){
  const email=$('auEmail').value.trim(), pass=$('auPass').value;
  const err=$('auErr'); err.textContent=''; err.style.color='';
  if(!email||!pass){err.textContent='Completá email y contraseña.';return;}
  $('auBtn').disabled=true;
  try{
    if(authMode==='signup'){
      const name=$('suName').value.trim();
      if(!name){err.textContent='Ingresá tu nombre.';$('auBtn').disabled=false;return;}
      if(pass.length<6){err.textContent='La contraseña debe tener al menos 6 caracteres.';$('auBtn').disabled=false;return;}
      const {data:su, error}=await SB.auth.signUp({email,password:pass,options:{data:{
        full_name:name, role:$('suRole').value, license:$('suLicense').value.trim()}}});
      if(error) throw error;
      if(su && su.user && Array.isArray(su.user.identities) && su.user.identities.length===0){
        err.textContent='Ese email ya tiene una cuenta. Usá "Ingresar", o "¿Olvidaste tu contraseña?".';
        setAuthMode('login'); $('auBtn').disabled=false; return;
      }
      const {error:e2}=await SB.auth.signInWithPassword({email,password:pass});
      if(e2){ err.style.color='var(--vital)'; err.textContent='¡Cuenta creada! Si no sos el primer usuario, queda pendiente de que un administrador te active.'; setAuthMode('login'); $('auBtn').disabled=false; return; }
    }else{
      const {error}=await SB.auth.signInWithPassword({email,password:pass});
      if(error) throw error;
    }
    await loadMe();
  }catch(e){
    let m=e.message||'Error';
    if(/Invalid login/i.test(m)) m='Email o contraseña incorrectos.';
    if(/already registered/i.test(m)) m='Ese email ya está registrado. Probá ingresar.';
    if(/at least 6/i.test(m)) m='La contraseña debe tener al menos 6 caracteres.';
    const e2=$('auErr'); if(e2) e2.textContent=m;
  }finally{ const b=$('auBtn'); if(b) b.disabled=false; }
}
async function doSignOut(){await SB.auth.signOut();ME=null;location.reload();}
async function forgotPass(){
  const email=$('auEmail').value.trim(); const err=$('auErr'); err.style.color='';
  if(!email){err.textContent='Escribí tu email arriba y volvé a tocar el enlace.';return;}
  const {error}=await SB.auth.resetPasswordForEmail(email,{redirectTo:location.href});
  if(error){err.textContent=error.message;return;}
  err.style.color='var(--vital)';
  err.textContent='Si el email está registrado, te enviamos un enlace para restablecer la contraseña. Revisá también spam.';
}

/* ---------- boot ---------- */
async function loadMe(){
  const {data:{user}}=await SB.auth.getUser();
  if(!user){ renderAuth('login'); return; }
  try{
    const {data:aal}=await SB.auth.mfa.getAuthenticatorAssuranceLevel();
    if(aal && aal.nextLevel==='aal2' && aal.currentLevel!=='aal2'){ await promptMfaChallenge(); return; }
  }catch(e){}
  const {data,error}=await DB().from('staff').select('*').eq('user_id',user.id).maybeSingle();
  if(error){ renderAuth('login'); const e2=$('auErr'); if(e2)e2.textContent=error.message; return; }
  if(!data){ renderAuth('login'); return; }
  if(!data.is_active){ renderAuth('pending'); return; }
  ME=data; ME.email=user.email;
  await loadDirectory();
  screen('app');
  updateTop(); setInterval(updateTop,60000);
  navigate('inicio');
}
async function loadDirectory(){
  const {data}=await DB().from('staff').select('user_id,full_name,role');
  DIR={}; (data||[]).forEach(s=>DIR[s.user_id]=s);
}

/* ---------- mi cuenta + 2FA ---------- */
function openAccount(){ modalOpen('Mi cuenta','<div id="accBody" class="loading" style="padding:20px">Cargando…</div>','Cerrar',()=>true); renderAccount(); }
async function renderAccount(){
  let hasTotp=false, totpId=null;
  try{ const {data}=await SB.auth.mfa.listFactors(); const t=(data&&data.totp&&data.totp[0])||null; if(t){hasTotp=true;totpId=t.id;} }catch(e){}
  const el=$('accBody'); if(!el) return; el.className='';
  el.innerHTML=
    '<div style="margin-bottom:6px"><b>Datos</b><div class="meta" style="margin-top:4px;line-height:1.6">'+esc(ME.full_name||'')+' · '+(ROLE_LABEL[ME.role]||ME.role)+'<br>'+esc(ME.email||'')+'</div></div>'+
    '<hr style="border:none;border-top:1px solid var(--div);margin:14px 0">'+
    '<div style="margin-bottom:6px"><b>Contraseña</b><br><button class="btn sm" style="margin-top:8px" onclick="openChangePass()">Cambiar contraseña</button></div>'+
    '<hr style="border:none;border-top:1px solid var(--div);margin:14px 0">'+
    '<div><b>Verificación en dos pasos (2FA)</b>'+
      (hasTotp
        ? '<div style="margin:7px 0;color:var(--vital);font-family:var(--f-ui);font-size:13px">✓ Activada</div><button class="btn sm dg" onclick="disableMfa(\''+totpId+'\')">Desactivar 2FA</button>'
        : '<p class="meta" style="margin:7px 0;line-height:1.6">Suma una capa extra de seguridad: al ingresar te va a pedir un código de una app como Google Authenticator o Authy. Muy recomendado para la dirección.</p><button class="btn primary sm" onclick="startEnrollMfa()">Activar 2FA</button>')+
    '</div>';
}
function openChangePass(){
  modalOpen('Cambiar contraseña',
    '<div class="field"><label>Nueva contraseña</label><input id="cpNew" type="password" placeholder="Mínimo 8 caracteres"></div>'+
    '<div class="field"><label>Repetir contraseña</label><input id="cpNew2" type="password"></div>','Guardar', changePass);
}
async function changePass(){
  const a=$('cpNew').value, b=$('cpNew2').value;
  if(a.length<8){toast('La contraseña debe tener al menos 8 caracteres');return false;}
  if(a!==b){toast('Las contraseñas no coinciden');return false;}
  const {error}=await SB.auth.updateUser({password:a});
  if(error){toast(error.message);return false;}
  toast('Contraseña actualizada'); return true;
}
async function startEnrollMfa(){
  try{ const {data:f}=await SB.auth.mfa.listFactors(); for(const fac of ((f&&f.all)||[])){ if(fac.status!=='verified'){ await SB.auth.mfa.unenroll({factorId:fac.id}); } } }catch(e){}
  const {data,error}=await SB.auth.mfa.enroll({factorType:'totp',friendlyName:'REVIGEN'});
  if(error){toast(error.message);return;}
  const qr=data.totp.qr_code||'', secret=data.totp.secret||'', fid=data.id;
  const qrHtml = qr.indexOf('<svg')===0 ? '<div style="width:190px;height:190px;margin:0 auto">'+qr+'</div>' : '<img src="'+qr+'" style="width:190px;height:190px;display:block;margin:0 auto">';
  modalOpen('Activar 2FA',
    '<p class="meta" style="margin:0 0 8px">1) Escaneá este código con Google Authenticator, Authy o Microsoft Authenticator:</p>'+
    '<div style="background:#fff;padding:10px;border-radius:10px">'+qrHtml+'</div>'+
    '<p class="meta" style="margin:8px 0 0">¿No podés escanear? Cargá esta clave manualmente:<br><code style="font-size:12px;color:var(--vital)">'+esc(secret)+'</code></p>'+
    '<div class="field" style="margin-top:10px"><label>2) Ingresá el código de 6 dígitos</label><input id="enrCode" inputmode="numeric" maxlength="6" placeholder="000000" style="text-align:center;letter-spacing:.4em;font-size:20px"></div>',
    'Confirmar', async ()=>{
      const code=($('enrCode').value||'').trim();
      if(code.length<6){toast('Ingresá los 6 dígitos');return false;}
      const {data:ch,error:e1}=await SB.auth.mfa.challenge({factorId:fid}); if(e1){toast(e1.message);return false;}
      const {error:e2}=await SB.auth.mfa.verify({factorId:fid,challengeId:ch.id,code}); if(e2){toast('Código incorrecto, probá de nuevo');return false;}
      toast('2FA activada correctamente'); return true;
    });
}
async function disableMfa(fid){
  if(!confirm('¿Desactivar la verificación en dos pasos?')) return;
  const {error}=await SB.auth.mfa.unenroll({factorId:fid});
  if(error){toast(error.message);return;}
  toast('2FA desactivada'); modalClose();
}
async function promptMfaChallenge(){
  let totp=null;
  try{ const {data}=await SB.auth.mfa.listFactors(); totp=(data&&data.totp&&data.totp[0])||null; }catch(e){}
  if(!totp){ location.reload(); return; }
  screen('acceso'); $('authForm').innerHTML='<div class="eyebrow" style="margin-bottom:8px">Verificación en dos pasos</div><div style="font-size:20px;margin-bottom:12px">Ingresá tu código</div><p class="meta">Abrí tu app de autenticación y cargá el código de 6 dígitos.</p>';
  modalOpen('Verificación en dos pasos',
    '<p class="meta" style="margin:0 0 4px">Ingresá el código de 6 dígitos de tu app de autenticación.</p>'+
    '<div class="field"><input id="mfaCode" inputmode="numeric" maxlength="6" placeholder="000000" style="text-align:center;letter-spacing:.4em;font-size:20px"></div>',
    'Verificar', async ()=>{
      const code=($('mfaCode').value||'').trim();
      if(code.length<6){toast('Ingresá los 6 dígitos');return false;}
      const {data:ch,error:e1}=await SB.auth.mfa.challenge({factorId:totp.id}); if(e1){toast(e1.message);return false;}
      const {error:e2}=await SB.auth.mfa.verify({factorId:totp.id,challengeId:ch.id,code}); if(e2){toast('Código incorrecto');return false;}
      await loadMe(); return true;
    });
}


/* ===================== DATOS CALCULADOS (sección 6) ===================== */
function groupBy(list,key){const m={};(list||[]).forEach(r=>{const k=r[key];(m[k]=m[k]||[]).push(r);});return m;}
function todayISO(){const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate()).toISOString();}
function nowLocalInput(){const n=new Date();const p=x=>(''+x).padStart(2,'0');return n.getFullYear()+'-'+p(n.getMonth()+1)+'-'+p(n.getDate())+'T'+p(n.getHours())+':'+p(n.getMinutes());}
function whenISO(id){const e=$(id);return (e&&e.value)?new Date(e.value).toISOString():new Date().toISOString();}
function sameDay(d){if(!d)return false;const x=new Date(d),n=new Date();return x.getFullYear()===n.getFullYear()&&x.getMonth()===n.getMonth()&&x.getDate()===n.getDate();}
function isFuture(d){return d && new Date(d).getTime()>=Date.now();}
function whoName(uid){const s=DIR[uid];return s?s.full_name:'—';}

async function loadCache(){
  const [P,AP,IND,CON,LB,NT,VC,VS,AT,ICP] = await Promise.all([
    DB().from('patients').select('id,hc_number,full_name,doc_id,doc_type,birth_date,sex,base_diagnosis,stage,g6pd_status,created_at,coverage,affiliate_number,allergies').is('deleted_at',null),
    DB().from('appointments').select('patient_id,starts_at,discipline,professional_id,status,title'),
    DB().from('indications').select('id,patient_id,kind,active,vitc_target_dose_g').in('kind',['vitamina_c','infusion']).eq('active',true),
    DB().from('consents').select('patient_id,kind,signed_at').eq('kind','vitamina_c'),
    DB().from('labs').select('patient_id,measured_at,creatinina,recorded_by').order('measured_at',{ascending:false}),
    DB().from('notes').select('patient_id,discipline,author_id,created_at').order('created_at',{ascending:false}),
    DB().from('vitc_administrations').select('patient_id,administered_at,adverse_events,administered_by').order('administered_at',{ascending:false}),
    DB().from('vitals').select('patient_id,measured_at,recorded_by').order('measured_at',{ascending:false}),
    DB().from('attachments').select('patient_id,created_at,uploaded_by').order('created_at',{ascending:false}),
    DB().from('indication_components').select('indication_id,component_id,name'),
    loadCatalog()
  ]);
  const patients=P.data||[], appts=AP.data||[];
  const byPatAppt=groupBy(appts,'patient_id');
  const indSet=new Set((IND.data||[]).map(r=>r.patient_id));
  const indByPat={}; (IND.data||[]).forEach(r=>{indByPat[r.patient_id]=r;});
  const icByInd=groupBy(ICP.data||[],'indication_id');
  const g6Set=new Set((IND.data||[]).filter(i=>indG6pd(Object.assign({},i,{comps:icByInd[i.id]||[]}))).map(i=>i.patient_id));   // tiene vitamina C (o un componente con aviso G6PD)
  const consSet=new Set((CON.data||[]).filter(r=>r.signed_at).map(r=>r.patient_id));   // cuenta solo el consentimiento firmado
  const labsByPat=groupBy(LB.data,'patient_id');
  const notesByPat=groupBy(NT.data,'patient_id');
  const vitcByPat=groupBy(VC.data,'patient_id');
  const vitalsByPat=groupBy(VS.data,'patient_id');
  const attByPat=groupBy(AT.data,'patient_id');

  const calc={};
  patients.forEach(p=>{
    const pid=p.id;
    const pa=byPatAppt[pid]||[];
    const futureAppts=pa.filter(a=>isFuture(a.starts_at)&&a.status==='programado').sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at));
    const notes=notesByPat[pid]||[], vitc=vitcByPat[pid]||[], labs=labsByPat[pid]||[], vitals=vitalsByPat[pid]||[], atts=attByPat[pid]||[];
    // ---- áreas del plan (6.2) ----
    function areaStat(hasRecent,hasHistory,hasFutureAppt){
      if(hasRecent||hasFutureAppt) return 'active';
      if(hasHistory) return 'stale';
      return 'none';
    }
    const futDisc=disc=>futureAppts.some(a=>a.discipline===disc);
    const lastNoteDisc=disc=>{const r=notes.find(n=>n.discipline===disc);return r?r.created_at:null;};
    const areaFor=(records,lastDate,futureFlag)=>{
      const hasHistory=records>0;
      const hasRecent=lastDate!=null && daysSince(lastDate)<=DIAS_AREA_ACTIVA;
      return areaStat(hasRecent,hasHistory,futureFlag);
    };
    const vitcCount=vitc.length, vitcLast=vitc[0]?vitc[0].administered_at:null;
    const nutriRecs=notes.filter(n=>n.discipline==='nutricion'), psicoRecs=notes.filter(n=>n.discipline==='psicooncologia'), ejerRecs=notes.filter(n=>n.discipline==='ejercicio');
    const hasVitcInd=indSet.has(pid);
    const futMegadosis=futureAppts.some(isMegadosisAppt);
    const areas={
      vitc:      areaFor(vitcCount, vitcLast, hasVitcInd || futMegadosis), // indicación activa o turno de megadosis = plan vigente
      nutricion: areaFor(nutriRecs.length, lastNoteDisc('nutricion'), futDisc('nutricion')),
      psicooncologia: areaFor(psicoRecs.length, lastNoteDisc('psicooncologia'), futDisc('psicooncologia')),
      ejercicio: areaFor(ejerRecs.length, lastNoteDisc('ejercicio'), futDisc('ejercicio'))
    };
    const areasActivas=Object.values(areas).filter(s=>s==='active').length;
    // ---- pendientes (6.1) ----
    const pend=[];
    if(hasVitcInd){
      if(g6Set.has(pid) && (p.g6pd_status||'no_evaluado')!=='normal') pend.push({kind:'g6pd',level:'crit',label:(p.g6pd_status==='deficiente'?'G6PD deficiente':'Falta el G6PD')});
      if(g6Set.has(pid) && !consSet.has(pid)) pend.push({kind:'consent',level:'warn',label:'Sin consentimiento firmado'});
      const lastLab=labs[0]?labs[0].measured_at:null;
      const turnoProx7=futureAppts.some(a=>daysSince(a.starts_at)>=-7); // starts within next 7 days
      const within7=futureAppts.some(a=>{const dt=(new Date(a.starts_at)-Date.now())/86400000;return dt>=0&&dt<=7;});
      if((lastLab==null||daysSince(lastLab)>DIAS_LAB_VIGENTE) && within7) pend.push({kind:'lab',level:'warn',label:'Laboratorio vencido'});
    }
    // ---- turno hoy ----
    const hoyAppt=pa.filter(a=>sameDay(a.starts_at)&&a.status!=='cancelado').sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at))[0]||null;
    // ---- último registro (6.4) ----
    const cand=[];
    if(notes[0]) cand.push({t:notes[0].created_at,who:notes[0].author_id});
    if(vitc[0]) cand.push({t:vitc[0].administered_at,who:vitc[0].administered_by});
    if(vitals[0]) cand.push({t:vitals[0].measured_at,who:vitals[0].recorded_by});
    if(labs[0]) cand.push({t:labs[0].measured_at,who:labs[0].recorded_by});
    if(atts[0]) cand.push({t:atts[0].created_at,who:atts[0].uploaded_by});
    cand.sort((a,b)=>new Date(b.t)-new Date(a.t));
    const ultimo=cand[0]||null;
    const anyActivity45 = cand.some(c=>daysSince(c.t)<=DIAS_AREA_ACTIVA) || areasActivas>0;
    const anyHistory = cand.length>0 || vitcCount>0 || notes.length>0;
    // ---- situación (6.3) ----
    let sit;
    if(pend.some(x=>x.kind==='g6pd')) sit={label:'Revisar G6PD',cls:'crit'};
    else if(pend.some(x=>x.kind==='consent')) sit={label:'Falta consentimiento',cls:'warn'};
    else if(pend.some(x=>x.kind==='lab')) sit={label:'Laboratorio vencido',cls:'warn'};
    else if(hoyAppt) sit={label:'Turno hoy '+fmtHM(hoyAppt.starts_at),cls:'ok'};
    else if(anyActivity45) sit={label:'En tratamiento',cls:''};
    else if(anyHistory) sit={label:'En seguimiento',cls:''};
    else sit={label:'Sin registros aún',cls:'off'};

    calc[pid]={areas,areasActivas,pend,proximo:futureAppts[0]||null,ultimo,sit,hoyAppt,hasVitcInd,vitcCount,vitcTarget:indByPat[pid]?indByPat[pid].vitc_target_dose_g:null,lastCreat:(labs.find(l=>l.creatinina!=null)||null)};
  });

  CACHE={patients,appts,calc,indByPat,
    counts:{
      pacientes:patients.length,
      altasMes:patients.filter(p=>{const c=new Date(p.created_at),n=new Date();return c.getFullYear()===n.getFullYear()&&c.getMonth()===n.getMonth();}).length
    },
    labs:LB.data||[], notes:NT.data||[], vitc:VC.data||[], atts:AT.data||[]
  };
  return CACHE;
}

/* dots de áreas para el listado */
function areaDots(areas){
  const order=['vitc','nutricion','psicooncologia','ejercicio'];
  return '<span class="dots">'+order.map(k=>{
    const s=areas[k];
    const col = s==='active' ? (DASH_COL[k]||'#15803D') : (s==='stale' ? '#C98A2E' : '#D8DCD3');
    const cls = s==='active'?'a':(s==='stale'?'p':'');
    return '<i class="'+cls+'" title="'+(AREA_NAME&&AREA_NAME[k]?AREA_NAME[k]:k)+'" style="background:'+col+'"></i>';
  }).join('')+'</span>';
}

async function createPatient(){

    doc=$('npDoc').value.trim(), birth=$('npBirth').value, phone=$('npPhone').value.trim(), cov=$('npCoverage').value.trim();

  if(!birth)faltan.push('fecha de nacimiento'); if(!phone)faltan.push('teléfono'); if(!cov)faltan.push('obra social');
  if(faltan.length){toast('Faltan datos: '+faltan.join(', '));return false;}
  const {data:dups}=await DB().from('patients').select('id,full_name,hc_number').eq('doc_id',doc);
  if(dups&&dups.length){
    const d=dups[0], box=$('npDup'); box.classList.remove('hidden');

}
async function doCreatePatient(last,first,dtype,doc,birth,phone,cov){
  const rec={full_name:last+', '+first, last_name:last, first_name:first, doc_type:dtype, doc_id:doc,
    birth_date:birth, phone:phone, coverage:cov, created_by:ME.user_id};
  const {data,error}=await DB().from('patients').insert(rec).select().single();
  if(error){toast(error.message);return;}

async function loadFichaCalc(){
  const pid=CUR.id;
  const q=[
    DB().from('appointments').select('*').eq('patient_id',pid),
    DB().from('labs').select('*').eq('patient_id',pid).order('measured_at',{ascending:false}),
    DB().from('notes').select('*').eq('patient_id',pid).order('created_at',{ascending:false}),
    DB().from('vitc_administrations').select('*').eq('patient_id',pid).order('administered_at',{ascending:false}),
    DB().from('vitals').select('patient_id,recorded_by,measured_at').eq('patient_id',pid),
    DB().from('medications').select('patient_id,administered_by,administered_at').eq('patient_id',pid),
    DB().from('consents').select('*').eq('patient_id',pid).order('created_at',{ascending:false}),
    DB().from('indications').select('*').eq('patient_id',pid).in('kind',['vitamina_c','infusion']).eq('active',true).order('created_at',{ascending:false}),
    DB().from('indication_components').select('*').eq('patient_id',pid),
    DB().from('infusion_components_given').select('*').eq('patient_id',pid),
    loadCatalog()
  ];
  const [AP,LB,NT,VC,VS,MD,CO,IND,ICP,GIV]=await Promise.all(q);
  let audit=[];
  if(can.director()){ const a=await DB().from('audit_log').select('*').eq('patient_id',pid).order('at',{ascending:false}).limit(6); audit=a.data||[]; }
  const icomp=groupBy(ICP.data||[],'indication_id');
  const inds=(IND.data||[]).map(i=>Object.assign(i,{comps:icomp[i.id]||[]}));   // infusiones vigentes (puede haber varias)
  const given=groupBy(GIV.data||[],'administration_id');                       // componentes administrados por infusión
  const appts=AP.data||[], labs=LB.data||[], notes=NT.data||[], vitc=VC.data||[], vitals=VS.data||[], meds=MD.data||[], cons=CO.data||[], ind=inds[0]||null;
  // áreas
  const now=Date.now();
  const futureAppts=appts.filter(a=>isFuture(a.starts_at)&&a.status==='programado').sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at));
  const futDisc=d=>futureAppts.some(a=>a.discipline===d);
  const lastDisc=d=>{const r=notes.find(n=>n.discipline===d);return r?r.created_at:null;};
  const areaFor=(recs,last,fut)=>{ if((last&&daysSince(last)<=DIAS_AREA_ACTIVA)||fut)return 'active'; return recs>0?'stale':'none'; };
  const futMegadosis=futureAppts.some(isMegadosisAppt);
  const areas={
    vitc:areaFor(vitc.length, vitc[0]?vitc[0].administered_at:null, !!ind || futMegadosis),
    nutricion:areaFor(notes.filter(n=>n.discipline==='nutricion').length,lastDisc('nutricion'),futDisc('nutricion')),
    psicooncologia:areaFor(notes.filter(n=>n.discipline==='psicooncologia').length,lastDisc('psicooncologia'),futDisc('psicooncologia')),
    ejercicio:areaFor(notes.filter(n=>n.discipline==='ejercicio').length,lastDisc('ejercicio'),futDisc('ejercicio'))
  };
  const areaMeta={
    vitc:{n:vitc.length, last:vitc[0]?vitc[0].administered_at:null, who:vitc[0]?vitc[0].administered_by:null, prox:futureAppts.find(isMegadosisAppt)||null},
    nutricion:{n:notes.filter(n=>n.discipline==='nutricion').length,last:lastDisc('nutricion'),who:(notes.find(n=>n.discipline==='nutricion')||{}).author_id,prox:futureAppts.find(a=>a.discipline==='nutricion')||null},
    psicooncologia:{n:notes.filter(n=>n.discipline==='psicooncologia').length,last:lastDisc('psicooncologia'),who:(notes.find(n=>n.discipline==='psicooncologia')||{}).author_id,prox:futureAppts.find(a=>a.discipline==='psicooncologia')||null},
    ejercicio:{n:notes.filter(n=>n.discipline==='ejercicio').length,last:lastDisc('ejercicio'),who:(notes.find(n=>n.discipline==='ejercicio')||{}).author_id,prox:futureAppts.find(a=>a.discipline==='ejercicio')||null}
  };
  // quiénes atienden (6.5)
  const cnt={};
  const add=uid=>{ if(uid){cnt[uid]=(cnt[uid]||0)+1;} };
  notes.forEach(n=>add(n.author_id)); vitc.forEach(v=>add(v.administered_by)); meds.forEach(m=>add(m.administered_by));
  vitals.forEach(v=>add(v.recorded_by)); labs.forEach(l=>add(l.recorded_by)); appts.forEach(a=>add(a.professional_id));
  add(CUR.created_by); add(CUR.updated_by); // quien crea/edita la ficha también cuenta como que la atiende
  const people=Object.keys(cnt).map(uid=>({uid,n:cnt[uid],s:DIR[uid]})).filter(x=>x.s).sort((a,b)=>b.n-a.n);
  // asistencia 90d
  const d90=now-90*86400000;
  const ap90=appts.filter(a=>{const t=new Date(a.starts_at).getTime();return t>=d90&&t<=now;});
  const as=ap90.filter(a=>a.status==='asistio').length, ab=ap90.filter(a=>a.status==='ausente').length;
  // consentimientos
  const consBy={}; cons.forEach(c=>{ if(!consBy[c.kind] || (!consBy[c.kind].signed_at && c.signed_at)) consBy[c.kind]=c; });   // prioriza el firmado
  FCALC={appts,labs,notes,vitc,vitals,meds,cons,ind,inds,given,areas,areaMeta,people,futureAppts,
    asist:{as,ab,tot:as+ab}, consBy, audit, lastCreat:labs.find(l=>l.creatinina!=null)||null};
  return FCALC;
}

function setTab(t){
  if(t==='audit'&&!can.director()) t='resumen';
  if(t==='vitc'||t==='enf'||t==='indic') t='trat';   // Megadosis, Enfermería e Indicaciones quedaron unificadas en Tratamientos
  if(t==='evol') t='hc';
  curTab=t;
  document.querySelectorAll('#tabBar button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  const map={resumen:renderResumen,hc:renderHC,trat:renderTrat,docs:renderDocs,audit:renderAudit};
  (map[t]||renderResumen)();
}

function areaCard(key){
  const st=FCALC.areas[key], m=FCALC.areaMeta[key];
  const stTag = st==='active'?'<span class="st ok" style="font-size:13px"><span class="d"></span>Activa</span>'
    : st==='stale'?'<span class="st warn" style="font-size:13px"><span class="d"></span>Sin movimiento</span>'
    : '<span class="st off" style="font-size:13px"><span class="d"></span>Sin registros</span>';
  let val = st==='none'?'—':(key==='vitc'?m.n+' '+(m.n===1?'administración':'administraciones'):m.n+' registro'+(m.n===1?'':'s'));
  let sub;
  if(st==='none') sub='No hay registros ni turnos cargados para esta área';
  else{
    const parts=[];
    if(m.last) parts.push('Último el '+fmtDMShort(m.last));
    if(m.who&&DIR[m.who]) parts.push(lastNameOf(DIR[m.who].full_name));
    if(m.prox) parts.push('próximo turno '+fmtDMShort(m.prox.starts_at));
    sub=parts.join(' · ')||'—';
  }
  const icon = st==='none' ? AREA_ICON[key] : AREA_ICON[key].replace('<svg ','<svg style="stroke:'+(DASH_COL[key]||'var(--vital)')+'" ');
  return '<div class="c'+(st==='none'?' off':'')+'"><div class="hd">'+icon+'<span class="nm">'+AREA_NAME[key]+'</span>'+stTag+'</div>'+
    '<div class="v">'+val+'</div><div class="s">'+esc(sub)+'</div></div>';
}
function labChartSVG(analyte){
  const rows=(FCALC.labs||[]).filter(l=>l[analyte]!=null).slice(0,6).reverse();
  if(rows.length<1) return '<div class="empty" style="padding:32px 12px"><p>Todavía no hay valores de este analito cargados.</p></div>';
  const W=480,H=208,L=44,R=464,T=24,B=176;
  const vals=rows.map(r=>Number(r[analyte]));
  let mn=Math.min(...vals), mx=Math.max(...vals); if(mn===mx){mn=mn*0.9;mx=mx*1.1||1;}
  const pad=(mx-mn)*0.15||1; mn-=pad; mx+=pad;
  const n=rows.length;
  const X=i=> n===1?(L+R)/2 : L+ (R-L)*i/(n-1);
  const Y=v=> B-(B-T)*((v-mn)/(mx-mn));
  const pts=rows.map((r,i)=>[X(i),Y(Number(r[analyte]))]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=(n>1)?('M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1)+pts.slice(1).map(p=>'L'+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('')+'L'+pts[n-1][0].toFixed(1)+' '+B+'L'+pts[0][0].toFixed(1)+' '+B+'Z'):'';
  const grid=[T,(T+B)/2,B].map(y=>'<line x1="'+L+'" y1="'+y+'" x2="'+R+'" y2="'+y+'"/>').join('');
  const ylabs=[mx,(mx+mn)/2,mn].map((v,i)=>'<text x="'+(L-10)+'" y="'+([T+4,(T+B)/2+4,B+4][i])+'">'+ (Math.round(v*10)/10) +'</text>').join('');
  const dots=pts.slice(0,-1).map(p=>'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.4"/>').join('');
  const last=pts[n-1];
  const xlabs=rows.map((r,i)=>'<text x="'+X(i).toFixed(1)+'" y="196">'+fmtDMShort(r.measured_at)+'</text>').join('');
  return '<svg viewBox="0 0 480 208" width="100%" role="img"><defs><linearGradient id="gh" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0" stop-color="#3C6B3A" stop-opacity=".16"/><stop offset="1" stop-color="#3C6B3A" stop-opacity="0"/></linearGradient></defs>'+
    '<g stroke="#E6E9E1" stroke-width="1">'+grid+'</g>'+
    '<g fill="#79837A" font-size="11.5" font-family="Inter,sans-serif" text-anchor="end">'+ylabs+'</g>'+
    (area?'<path d="'+area+'" fill="url(#gh)"/>':'')+
    '<path d="'+line+'" fill="none" stroke="#3C6B3A" stroke-width="2.2"/>'+
    '<g fill="#3C6B3A">'+dots+'</g>'+

function vsTxt(ta,fc,glu){ return [ta?'TA '+esc(ta):'', fc!=null?'FC '+esc(fc):'', glu!=null?'glucemia '+esc(glu):''].filter(Boolean).join(' · '); }
function tlVitc(v,gv,ind){
  const pre=vsTxt(v.bp_pre,v.hr_pre,v.glucose_pre), post=vsTxt(v.bp_post,v.hr_post,v.glucose_post);
  const comps=(gv&&gv.length)
    ? gv.map(c=>c.given?esc(compTxt(c)):'<span class="vi-off">'+esc(c.name)+'</span> (no se dio'+(c.reason?': '+esc(c.reason):'')+')').join(' · ')
    : esc(v.dose_g)+' g de vitamina C';
  const lines=[comps, [v.dilution_ml?esc(v.dilution_ml)+' ml':'', v.rate_g_min?esc(v.rate_g_min)+' gtt/min':''].filter(Boolean).join(' · '), pre?'Antes: '+pre:'', post?'Después: '+post:''].filter(Boolean);
  const ev=(v.adverse_events&&v.adverse_events.trim())?'<span class="st warn"><span class="d"></span>Evento adverso: '+esc(v.adverse_events)+'</span>':'<span class="st ok"><span class="d"></span>Sin eventos adversos</span>';
  const title='Infusión'+(ind?' · '+esc(indTitle(Object.assign({},ind,{comps:gv||[]}))):((gv&&gv.length)?'':' de megadosis'));

  return tlEntry({who:x.recorded_by, at:x.measured_at, tag:tlTag('Enfermería',AREA_COL.enfermeria), title:'Control de signos vitales', lines:[parts.join(' · ')].concat(x.notes?[esc(x.notes)]:[]).filter(Boolean)});

function tlDay(d){

async function renderRegistro(){
  const host=$('regHost'); if(!host)return;
  const pid=CUR.id, q=t=>DB().from(t).select('*').eq('patient_id',pid);
  const [NT,VC,VS,LB,MD,AT,CO,IN,GV]=await Promise.all([q('notes'),q('vitc_administrations'),q('vitals'),q('labs'),q('medications'),q('attachments'),q('consents'),q('indications'),q('infusion_components_given')]);
  if(NT.error){host.innerHTML='<div class="callout"><p>'+esc(NT.error.message)+'</p></div>';return;}
  if(!CUR||CUR.id!==pid||curTab!=='hc'||!$('regHost')) return;   // cambió de paciente o de pestaña mientras cargaba
  CUR_NOTES={};
  const items=[], push=(t,at,who,fn)=>{ if(at) items.push({t,at,who,fn}); };
  (NT.data||[]).forEach(n=>push('notas',n.created_at,n.author_id,()=>entryNote(n)));
  const gvBy=groupBy(GV.data||[],'administration_id'), indBy={}; (IN.data||[]).forEach(i=>indBy[i.id]=i);
  (VC.data||[]).filter(v=>!v.deleted_at).forEach(v=>push('megadosis',v.administered_at,v.administered_by,()=>tlVitc(v,gvBy[v.id],indBy[v.indication_id])));
  (VS.data||[]).forEach(x=>push('signos',x.measured_at,x.recorded_by,()=>tlVital(x)));
  (LB.data||[]).forEach(x=>push('labs',x.measured_at,x.recorded_by,()=>tlLab(x)));
  (MD.data||[]).forEach(x=>push('medicacion',x.administered_at,x.administered_by,()=>tlMed(x)));
  (AT.data||[]).forEach(x=>push('docs',x.created_at,x.uploaded_by,()=>tlDoc(x)));
  (CO.data||[]).forEach(x=>push('docs',x.created_at,x.created_by,()=>tlConsent(x)));
  (IN.data||[]).filter(i=>!i.deleted_at).forEach(i=>push('indicaciones',i.created_at,i.prescribed_by,()=>tlInd(i)));
  items.sort((a,b)=>toDate(b.at)-toDate(a.at));
  const counts={}; items.forEach(i=>counts[i.t]=(counts[i.t]||0)+1);
  if(TL_FILTER!=='todo'&&!counts[TL_FILTER]) TL_FILTER='todo';
  const profs={}; items.forEach(i=>{ if(i.who&&DIR[i.who]) profs[i.who]=DIR[i.who].full_name; });
  if(EVOL_PROF!=='all'&&!profs[EVOL_PROF]) EVOL_PROF='all';
